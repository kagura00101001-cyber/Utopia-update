name: POD publish V1.5.4 final

on:
  workflow_dispatch:
  push:
    paths:
      - '.pod_release/v154_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble verified V1.5.4 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .pod_release/v154_clean/part_00.b64 \
            .pod_release/v154_clean/part_01.b64 \
            .pod_release/v154_clean/part_02.b64 \
            .pod_release/v154_final/part_03.b64 \
            .pod_release/v154_final/part_04.b64 \
            .pod_release/v154_clean/part_04.b64 \
            .pod_release/v154_final/part_07.b64 \
            .pod_release/v154_final/part_08.b64 \
            .pod_release/v154_final/part_09.b64 \
            .pod_release/v154_final/part_10.b64 \
            .pod_release/v154_final/part_11.b64 \
            .pod_release/v154_final/part_12.b64 \
            > /tmp/pod_v154_release_clean.tgz.b64
          echo 'c86d06cc34e7e9781aef9fbb6e09056f3c0454992c1aa918ccb0ff87003bd646  /tmp/pod_v154_release_clean.tgz.b64' | sha256sum -c -
          base64 -d /tmp/pod_v154_release_clean.tgz.b64 > /tmp/pod_v154_release_clean.tgz
          echo 'fdd5b8858b731f05e8f46697cddafba36c33b704804946e5597694604edfd2cf  /tmp/pod_v154_release_clean.tgz' | sha256sum -c -
          mkdir -p /tmp/pod_v154_release
          tar -xzf /tmp/pod_v154_release_clean.tgz -C /tmp/pod_v154_release

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pod_v154_release
          node --check POD_ChatGPT.user.js
          grep -q '^// @name         ChatGPT服装POD统一工作台 V1.2.2$' POD_ChatGPT.user.js
          grep -q '^// @version      1.5.4$' POD_ChatGPT.user.js
          grep -q '^// @version      1.5.4$' POD_ChatGPT.meta.js
          python - <<'PY'
          import json
          for p in ['POD_ChatGPT.latest.json','POD_ChatGPT_latest.json']:
              with open(p, encoding='utf-8') as f:
                  assert json.load(f)['version'] == '1.5.4', p
          with open('POD_ChatGPT.history.json', encoding='utf-8') as f:
              h = json.load(f)
          assert h['versions'][0]['version'] == '1.5.4'
          PY
          echo '1f9f25c21bafa10dd02d30aaec8cd787039882ce9e4b6382e9c014c5cb3babb9  POD_ChatGPT.user.js' | sha256sum -c -
          echo 'b964ce96cbcbb6a5827e8f4f97aa39dd3bfd4dfda441441817220800a03fc2da  POD_ChatGPT.meta.js' | sha256sum -c -
          echo '5205d1b70c9b9b80ca2e71fb6def173e01a9dd4b0f0d254e1d38aabca1484849  POD_ChatGPT.latest.json' | sha256sum -c -
          echo '5205d1b70c9b9b80ca2e71fb6def173e01a9dd4b0f0d254e1d38aabca1484849  POD_ChatGPT_latest.json' | sha256sum -c -
          echo '6fcb12cfa01166e1446020c8b58ca5c2bb318c251b6372708f476898c076fb07  POD_ChatGPT.history.json' | sha256sum -c -

      - name: Publish official files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pod_v154_release/POD_ChatGPT.user.js .
          cp /tmp/pod_v154_release/POD_ChatGPT.meta.js .
          cp /tmp/pod_v154_release/POD_ChatGPT.latest.json .
          cp /tmp/pod_v154_release/POD_ChatGPT_latest.json .
          cp /tmp/pod_v154_release/POD_ChatGPT.history.json .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json
          git diff --cached --quiet && { echo 'Nothing to publish'; exit 0; }
          git commit -m 'release: POD ChatGPT V1.5.4'
          git push origin HEAD:main
