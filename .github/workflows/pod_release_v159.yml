name: Release POD V1.5.9

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[internal] release POD V1.5.9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch POD V1.5.9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('POD_ChatGPT.user.js')
          s=p.read_text(encoding='utf-8')
          if "const APP_VERSION = '1.5.8';" not in s or '// @version      1.5.8' not in s:
              raise SystemExit('Expected production V1.5.8 source not found')

          s=s.replace('// @name:zh-CN   ChatGPT服装POD统一工作台 V1.5.8','// @name:zh-CN   ChatGPT服装POD统一工作台 V1.5.9',1)
          s=s.replace('// @version      1.5.8','// @version      1.5.9',1)
          s=s.replace('// @description  服装POD统一工作台：V1.5.8 修复创建图片已成功却被后续误判的问题；加入本批短期成功凭证、多重创建图片检测，并在真正连续3次激活失败且尚未发送时仅刷新1次后自动重试。','// @description  服装POD统一工作台：V1.5.9 改为事件驱动的创建图片检测；仅观察当前Composer与新出现菜单节点，兼容Composer重载并移除全页高频div/span扫描。',1)
          s=s.replace(' * ChatGPT服装POD统一工作台 V1.5.8',' * ChatGPT服装POD统一工作台 V1.5.9',1)
          anchor=" * - V1.5.8 创建图片状态增强：已成功激活后记录同批短期成功凭证并加入composer局部宽松证据检测，避免瞬时假阴性导致重复点+；真正连续3次激活失败且尚未发送时只刷新1次后自动重新准备本批，刷新后仍失败才暂停。"
          note=anchor+"\n * - V1.5.9 创建图片检测改为事件驱动：点击当前Composer的“+”后使用MutationObserver只处理新出现菜单节点，并限制在当前Composer/受控菜单/加号附近候选；Composer重载时重新捕获新输入区，移除document全页div/span高频扫描，同时保留V1.5.8成功凭证、单次刷新恢复与at-most-once发送规则。"
          if anchor not in s: raise SystemExit('V1.5.8 changelog anchor missing')
          s=s.replace(anchor,note,1)
          s=s.replace("const APP_VERSION = '1.5.8';","const APP_VERSION = '1.5.9';",1)

          # Add event-driven editor rebind helper immediately after findComposer.
          m=re.search(r"(  function findComposer\(\)\{[^\n]+\}\n)",s)
          if not m: raise SystemExit('findComposer anchor missing')
          helper=r'''  function waitForPromptEditorObserved(timeout=30000,allowPaused=false){
            const hit=findPromptEditor();
            if(hit)return Promise.resolve(hit);
            return new Promise(resolve=>{
              let done=false,queued=false,observer=null,timer=null,fallback=null;
              const finish=value=>{if(done)return;done=true;try{observer?.disconnect()}catch(_){}clearTimeout(timer);clearInterval(fallback);resolve(value||null);};
              const check=()=>{queued=false;if(!allowPaused&&!state.running){finish(null);return;}const e=findPromptEditor();if(e)finish(e);};
              const queue=()=>{if(done||queued)return;queued=true;(window.requestAnimationFrame||setTimeout)(check);};
              const root=document.body||document.documentElement;
              if(root){observer=new MutationObserver(queue);observer.observe(root,{childList:true,subtree:true});}
              fallback=setInterval(check,800);
              timer=setTimeout(()=>finish(findPromptEditor()),Math.max(1000,Number(timeout)||30000));
              queue();
            });
          }
'''
          s=s[:m.end()]+helper+s[m.end():]

          # Replace create-image discovery/activation with scoped event-driven implementation.
          pattern=re.compile(r"  function visibleMenuRoots\(\)\{[\s\S]*?\n  function setNativeValue",re.M)
          if len(pattern.findall(s))!=1: raise SystemExit('create-image block anchor mismatch')
          new_block=r'''  function visibleMenuRoots(){
            const selectors='[popover],[data-radix-popper-content-wrapper],[data-radix-menu-content],[data-headlessui-portal],[data-floating-ui-portal],[role="menu"],[role="dialog"],[role="listbox"]';
            return [...document.querySelectorAll(selectors)].filter(e=>isVisible(e)&&!insideMessage(e)&&!e.closest('#kagura-pod-panel'));
          }
          const CREATE_IMAGE_RE=/^(创建图片|创作图片|生成图片|create\s*image|generate\s*image)(?:\s|$)/i;
          const CREATE_INTERACTIVE_SELECTOR='button,[role="button"],[role="menuitem"],[role="option"],[data-radix-collection-item],[data-testid*="menu"],[data-testid*="tool"],[aria-label]';
          function plusControlledRoots(plus){
            const out=[];
            const add=x=>{if(x instanceof Element&&isVisible(x)&&!insideMessage(x)&&!x.closest('#kagura-pod-panel')&&!out.includes(x))out.push(x);};
            for(const attr of ['aria-controls','aria-owns'])for(const id of String(plus?.getAttribute?.(attr)||'').split(/\s+/).filter(Boolean))add(document.getElementById(id));
            visibleMenuRoots().forEach(add);
            return out;
          }
          function scoreCreateCandidate(e,plus){
            if(!(e instanceof Element)||!isVisible(e)||insideMessage(e)||e.closest('#kagura-pod-panel'))return null;
            const tx=`${plainText(e)} ${e.getAttribute?.('aria-label')||''}`.replace(/\s+/g,' ').trim();
            if(!tx||tx.length>220||!CREATE_IMAGE_RE.test(tx))return null;
            const r=e.getBoundingClientRect();if(r.width<45||r.height<18||r.height>190)return null;
            let score=1200;
            if(/^创建图片(?:\s|$)/.test(tx))score+=900;
            if(/可视化/.test(tx))score+=350;
            if(e.matches('button,[role="menuitem"],[role="option"],[role="button"]'))score+=420;
            if(e.closest('[role="menu"],[role="dialog"],[data-radix-popper-content-wrapper],[data-radix-menu-content]'))score+=500;
            if(plus instanceof Element){const p=plus.getBoundingClientRect(),dx=Math.abs((r.left+r.width/2)-(p.left+p.width/2)),dy=Math.abs((r.top+r.height/2)-(p.top+p.height/2));if(dx>760||dy>760)return null;score+=Math.max(0,500-Math.round((dx+dy)/2));}
            return{e,score,tx,r};
          }
          function bestCreateCandidate(nodes,plus){
            const arr=[];for(const e of nodes){const x=scoreCreateCandidate(e,plus);if(x)arr.push(x);}arr.sort((a,b)=>b.score-a.score);return arr[0]||null;
          }
          function scanCreateRoot(root,plus){
            if(!(root instanceof Element))return null;
            const nodes=[];if(root.matches?.(CREATE_INTERACTIVE_SELECTOR))nodes.push(root);nodes.push(...root.querySelectorAll(CREATE_INTERACTIVE_SELECTOR));return bestCreateCandidate(nodes,plus);
          }
          function findCreateItem(plus=findPlus()){
            const roots=plusControlledRoots(plus),found=[];for(const root of roots){const x=scanCreateRoot(root,plus);if(x)found.push(x);}found.sort((a,b)=>b.score-a.score);return found[0]||null;
          }
          function findCreateItemByPoint(plus){
            if(!(plus instanceof Element))return null;const p=plus.getBoundingClientRect(),nodes=new Set();
            const xs=[-260,-180,-100,-20,60,140,220].map(d=>p.left+p.width/2+d).filter(x=>x>2&&x<innerWidth-2);
            const ys=[45,90,140,195,255,325,400].map(d=>p.top-d).filter(y=>y>2&&y<innerHeight-2);
            for(const x of xs)for(const y of ys){const hit=document.elementFromPoint(x,y),el=hit?.closest?.(CREATE_INTERACTIVE_SELECTOR);if(el)nodes.add(el);}
            return bestCreateCandidate([...nodes],plus);
          }
          function scanAddedNodeForCreate(node,plus){
            if(!(node instanceof Element))return null;const x=scanCreateRoot(node,plus);if(x)return x;const popup=node.closest?.('[role="menu"],[role="dialog"],[data-radix-popper-content-wrapper],[data-radix-menu-content]');return popup?scanCreateRoot(popup,plus):null;
          }
          function waitCreateItemObserved(plus,timeout=6500){
            const immediate=findCreateItem(plus);if(immediate)return Promise.resolve(immediate);
            return new Promise(resolve=>{
              let done=false,observer=null,timer=null,fallback=null,lastPoint=0;
              const finish=x=>{if(done)return;done=true;try{observer?.disconnect()}catch(_){}clearTimeout(timer);clearInterval(fallback);resolve(x||null);};
              const root=document.body||document.documentElement;
              if(root){observer=new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){const x=scanAddedNodeForCreate(n,plus);if(x){finish(x);return;}}});observer.observe(root,{childList:true,subtree:true});}
              fallback=setInterval(()=>{const scoped=findCreateItem(plus);if(scoped){finish(scoped);return;}if(Date.now()-lastPoint>1200){lastPoint=Date.now();const near=findCreateItemByPoint(plus);if(near)finish(near);}},700);
              timer=setTimeout(()=>finish(findCreateItem(plus)||findCreateItemByPoint(plus)),Math.max(1200,Number(timeout)||6500));
            });
          }
          function waitForPlusObserved(timeout=8000){
            const hit=findPlus();if(hit)return Promise.resolve(hit);
            return new Promise(resolve=>{
              let done=false,queued=false,observer=null,timer=null,fallback=null;
              const finish=x=>{if(done)return;done=true;try{observer?.disconnect()}catch(_){}clearTimeout(timer);clearInterval(fallback);resolve(x||null);};
              const check=()=>{queued=false;const x=findPlus();if(x)finish(x);};
              const queue=()=>{if(done||queued)return;queued=true;(window.requestAnimationFrame||setTimeout)(check);};
              const root=document.body||document.documentElement;if(root){observer=new MutationObserver(queue);observer.observe(root,{childList:true,subtree:true});}
              fallback=setInterval(check,800);timer=setTimeout(()=>finish(findPlus()),Math.max(1000,Number(timeout)||8000));queue();
            });
          }
          function hasCreateChip(){
            const c=findComposer();if(!(c instanceof Element))return false;
            for(const e of c.querySelectorAll('button,[role="button"],[data-testid*="tool"],[data-testid*="chip"],[aria-label],div,span')){
              if(!isVisible(e)||insideMessage(e)||e.closest('#kagura-pod-panel'))continue;
              const tx=`${plainText(e)} ${e.getAttribute?.('aria-label')||''}`.replace(/\s+/g,' ').trim();if(tx&&tx.length<=180&&CREATE_IMAGE_RE.test(tx))return true;
            }
            return false;
          }
          function hasCreateChipLoose(){return hasCreateChip();}
          function createModePresent(){return hasCreateChip();}
          function waitCreateModeObserved(timeout=6500){
            if(createModePresent())return Promise.resolve(true);
            return new Promise(resolve=>{
              let done=false,queued=false,observer=null,timer=null,fallback=null;
              const finish=v=>{if(done)return;done=true;try{observer?.disconnect()}catch(_){}clearTimeout(timer);clearInterval(fallback);resolve(Boolean(v));};
              const check=()=>{queued=false;if(createModePresent())finish(true);};
              const queue=()=>{if(done||queued)return;queued=true;(window.requestAnimationFrame||setTimeout)(check);};
              const root=document.body||document.documentElement;if(root){observer=new MutationObserver(queue);observer.observe(root,{childList:true,subtree:true});}
              fallback=setInterval(check,800);timer=setTimeout(()=>finish(createModePresent()),Math.max(1200,Number(timeout)||6500));queue();
            });
          }
          async function activateCreate(){
            state.phase='activating_create_image';saveState();
            if(createModePresent()){rememberCreateModeProof();log('已存在“创建图片”模式，无需重复添加','success');return true;}
            if(recentCreateModeProof()){log('本批刚刚已确认“创建图片”模式成功；当前Composer标签瞬时未命中，沿用已确认状态，不重复点击“+”','warn');return true;}
            let last;
            for(let a=1;a<=3;a++){
              try{
                const editor=await waitForPromptEditorObserved(9000,false);if(!editor)throw new Error('当前Composer重新加载后仍未恢复输入框');
                const plus=await waitForPlusObserved(8000);if(!plus)throw new Error('未找到当前输入框左侧“+”按钮');
                smartClick(plus);log(`已点击当前Composer左侧“+”按钮（${a}/3），开始事件监听菜单`);
                let info=await waitCreateItemObserved(plus,6500);
                if(!info){const livePlus=findPlus();if(livePlus&&livePlus!==plus){log('检测到Composer/“+”节点已经重建，改用新节点重新监听当前菜单','warn');smartClick(livePlus);info=await waitCreateItemObserved(livePlus,5000);}}
                if(!info)throw new Error('当前Composer加号菜单中未检测到“创建图片”');
                log(`事件监听已定位“创建图片”菜单项：${info.tx||'创建图片'}`);smartClick(info.e);
                if(!await waitCreateModeObserved(6500))throw new Error('点击后当前Composer未检测到“创建图片”标签');
                rememberCreateModeProof();log('创建图片模式添加成功（事件驱动检测）','success');return true;
              }catch(e){last=e;log(`第 ${a} 次添加创建图片失败：${e.message}`,'warn');await sleep(700);}
            }
            throw new CreateModeRetryableError(`创建图片模式连续3次激活失败：${last?.message||last}`);
          }

          function setNativeValue'''
          s=pattern.sub(new_block,s,count=1)

          # Route editor waits through the observer helper so a re-mounted Composer is rebound.
          replacements={
            "if(!await waitUntil(()=>findPromptEditor(),30000,500))throw new Error('新建对话后未找到输入框');":"if(!await waitForPromptEditorObserved(30000,false))throw new Error('新建对话后未找到输入框');",
            "let e=await waitUntil(()=>findPromptEditor(),30000,300);if(!e)throw new Error('未找到提示词输入框');":"let e=await waitForPromptEditorObserved(30000,false);if(!e)throw new Error('未找到提示词输入框');",
            "const e=await waitUntil(()=>findPromptEditor(),30000,500,true);if(!e)throw new Error('新建对话后未找到输入框');":"const e=await waitForPromptEditorObserved(30000,true);if(!e)throw new Error('新建对话后未找到输入框');",
            "let e=await waitUntil(()=>findPromptEditor(),30000,300,true);if(!e)throw new Error('未找到提示词输入框');":"let e=await waitForPromptEditorObserved(30000,true);if(!e)throw new Error('未找到提示词输入框');",
            "e=await waitUntil(()=>findPromptEditor(),10000,300,true);":"e=await waitForPromptEditorObserved(10000,true);",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('editor wait anchor missing: '+old[:80])
              s=s.replace(old,new,1)

          # Safety assertions: the create-item finder must no longer scan document-wide div/span nodes.
          create_section=s[s.index('  function visibleMenuRoots()'):s.index('  function setNativeValue')]
          if "document.querySelectorAll('button,[role=\"button\"],[role=\"menuitem\"],[role=\"option\"],[data-radix-collection-item],div,span')" in create_section:
              raise SystemExit('document-wide div/span create-image scan still present')
          if 'new MutationObserver' not in create_section or 'addedNodes' not in create_section:
              raise SystemExit('event-driven create-image observer missing')
          if "const APP_VERSION = '1.5.9';" not in s: raise SystemExit('version patch failed')
          p.write_text(s,encoding='utf-8')

          header=s.split('// ==/UserScript==',1)[0]+'// ==/UserScript==\n'
          Path('POD_ChatGPT.meta.js').write_text(header,encoding='utf-8')

          notes=[
            '创建图片入口改为事件驱动检测：点击当前Composer的“+”后使用MutationObserver只处理新出现的菜单节点，不再对document全页div/span做高频扫描。',
            '创建图片候选限制在当前Composer关联菜单、aria-controls/aria-owns受控菜单和“+”附近有限区域，减少长聊天中误命中侧栏、历史消息或其他浮层。',
            '兼容ChatGPT新版Composer重新加载：输入框或“+”节点被替换后会重新捕获当前有效节点，再继续同一批次流程。',
            '创建图片激活后的标签确认同样改为事件监听 + 低频兜底，并继续保留V1.5.8同批短期成功凭证，避免瞬时DOM假阴性造成重复点击。',
            '继续保留创建图片真正连续3次失败后仅刷新1次、刷新后仍失败才暂停的规则；发送按钮一旦点击仍严格at-most-once，绝不因本次改动重复发送。',
            '不引入已撤回V1.6.x的全页高频扫描方案，不重构上传、发送确认、生图检测、下载隔离、暂停/刷新恢复等稳定模块。'
          ]
          latest={
            'version':'1.5.9',
            'install_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
            'download_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
            'published_at':'2026-09-07',
            'changelog':notes,
          }
          Path('POD_ChatGPT.latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('POD_ChatGPT_latest.json').write_text(json.dumps({'name':'ChatGPT服装POD统一工作台',**latest},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          hp=Path('POD_ChatGPT.history.json');hist=json.loads(hp.read_text(encoding='utf-8'))
          versions=[v for v in hist.get('versions',[]) if v.get('version')!='1.5.9']
          for v in versions:
              if v.get('version')=='1.5.8' and v.get('status')=='current':v['status']='stable'
          versions.insert(0,{
            'version':'1.5.9','date':'2026-09-07','status':'current','notes':notes,
            'archive_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/versions/POD_ChatGPT统一工作台_V1.5.9.txt',
            'commit':'__RELEASE_COMMIT__',
            'install_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/__RELEASE_COMMIT__/POD_ChatGPT.user.js'
          })
          hist['versions']=versions;hp.write_text(json.dumps(hist,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('versions/POD_ChatGPT统一工作台_V1.5.9.txt').write_text(s,encoding='utf-8')
          PY
          node --check POD_ChatGPT.user.js
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = '1.5.9';" in s
          assert 'waitCreateItemObserved' in s and 'waitForPromptEditorObserved' in s
          assert Path('POD_ChatGPT.meta.js').read_text(encoding='utf-8').count('// @version      1.5.9')==1
          assert json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))['version']=='1.5.9'
          assert json.loads(Path('POD_ChatGPT_latest.json').read_text(encoding='utf-8'))['version']=='1.5.9'
          print('POD V1.5.9 validation PASS')
          PY
      - name: Commit release payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pod_release_v159.yml
          git config user.name 'Kagura Update Bot'
          git config user.email 'kagura-update-bot@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.9.txt' .github/workflows/pod_release_v159.yml
          git commit -m 'release: publish POD Studio V1.5.9 event-driven create-image detection'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Finalize history commit link
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('POD_ChatGPT.history.json');s=p.read_text(encoding='utf-8');sha=os.environ['RELEASE_SHA']
          if '__RELEASE_COMMIT__' not in s: raise SystemExit('history placeholder missing')
          p.write_text(s.replace('__RELEASE_COMMIT__',sha),encoding='utf-8')
          PY
          git add POD_ChatGPT.history.json
          git commit -m 'release: finalize POD V1.5.9 history link'
          git push origin HEAD:main
      - name: Close trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close "${{ github.event.issue.number }}" --comment "POD V1.5.9 release workflow finished."
