name: Apply Ozon Complaint V1.1.3

on:
  push:
    paths:
      - '.github/workflows/apply-ozon-complaint-v113.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V1.1.3 patch
        shell: bash
        run: |
          set -euo pipefail
          patch Ozon_Complaint.user.js < patches/Ozon_Complaint_V1.1.3.patch
          node --check Ozon_Complaint.user.js
          grep -q '@version      1.1.3' Ozon_Complaint.user.js
          grep -q '@updateURL    https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_Complaint.meta.js' Ozon_Complaint.user.js
          grep -q 'Overwrite（覆盖）' Ozon_Complaint.user.js
      - name: Commit updated script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Ozon_Complaint.user.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Update Ozon Complaint to V1.1.3 native Tampermonkey updates'
          git push
