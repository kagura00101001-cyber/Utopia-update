name: POD publish V1.6.4 final

on:
  push:
    branches:
      - main
    paths:
      - '.pod_release/v164_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V1.6.4 patch
        run: python3 .pod_release/v164_final/patch_v164.py
      - name: Syntax check
        run: node --check POD_ChatGPT.user.js
      - name: Verify release
        shell: bash
        run: |
          grep -F '// @name         ChatGPT服装POD统一工作台 V1.2.2' POD_ChatGPT.user.js
          grep -F '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.4' POD_ChatGPT.user.js
          grep -F '// @version      1.6.4' POD_ChatGPT.user.js
          grep -F "const APP_VERSION = '1.6.4';" POD_ChatGPT.user.js
          grep -F 'function findCreateItemFallback' POD_ChatGPT.user.js
          grep -F 'location.pathname!==pathBefore' POD_ChatGPT.user.js
          grep -F '"version": "1.6.4"' POD_ChatGPT.latest.json
          grep -F '"version": "1.6.4"' POD_ChatGPT.history.json
      - name: Publish and self-clean
        shell: bash
        run: |
          rm -rf .pod_release/v164_final
          rm -f .github/workflows/pod_publish_v164_final.yml
          git config user.name "Kagura Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: POD ChatGPT V1.6.4 create-image menu compatibility fix"
          git push
