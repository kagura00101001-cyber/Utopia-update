name: "Publish V3.0.35 fixed"

"on":
  push:
    paths:
      - '.github/workflows/publish-v3.0.35-fixed.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 patches/publish_v3_0_35.py
      - name: Syntax check
        run: node -c Ozon_ChatGPT.user.js
      - name: Verify
        shell: bash
        run: |
          grep -F '// @version      3.0.35' Ozon_ChatGPT.user.js
          grep -F "cCreateButton('清空图片'" Ozon_ChatGPT.user.js
          grep -F 'function cClearSourceAndOutputImages' Ozon_ChatGPT.user.js
          test -s 'versions/Ozon_ChatGPT批量生图下载器_V3.0.34.txt'
          test -s 'versions/Ozon_ChatGPT批量生图下载器_V3.0.35.txt'
      - name: Commit
        shell: bash
        run: |
          git config user.name "Kagura Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Ozon_ChatGPT.user.js Ozon_ChatGPT.meta.js latest.json history.json versions
          git diff --cached --quiet && exit 0
          git commit -m "发布 V3.0.35 清空原图与成品图片"
          git push
