name: Lock POD userscript identity

on:
  push:
    paths:
      - '.pod_identity_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock base userscript identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('POD_ChatGPT.user.js')
          s = p.read_text(encoding='utf-8')
          old = '// @name         ChatGPT服装POD统一工作台\n'
          new = '// @name         ChatGPT服装POD统一工作台 V1.2.2\n'
          if old not in s:
              raise SystemExit('base @name not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .pod_identity_trigger .github/workflows/pod_lock_identity.yml
      - name: Commit identity lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: lock POD userscript update identity'
          git push
