name: "POD publish V1.6.5 final"

on:
  push:
    branches: [ main ]
    paths:
      - '.pod_release/v165_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch V1.6.5
        run: python3 .pod_release/v165_final/patch_v165.py
      - name: Syntax check
        run: node --check POD_ChatGPT.user.js
      - name: Verify V1.6.5
        shell: bash
        run: |
          grep -F '// @name         ChatGPT服装POD统一工作台 V1.2.2' POD_ChatGPT.user.js
          grep -F '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.5' POD_ChatGPT.user.js
          grep -F '// @version      1.6.5' POD_ChatGPT.user.js
          grep -F "const APP_VERSION = '1.6.5';" POD_ChatGPT.user.js
          grep -F 'const CREATE_MENU_ROOT_SELECTOR=' POD_ChatGPT.user.js
          grep -F 'function createWatcher(' POD_ChatGPT.user.js
          grep -F 'new MutationObserver' POD_ChatGPT.user.js
          grep -F '开始事件驱动监听新弹层' POD_ChatGPT.user.js
          ! grep -F 'function findCreateItemFallback' POD_ChatGPT.user.js
          grep -F '"version": "1.6.5"' POD_ChatGPT.latest.json
          grep -F 'MutationObserver' POD_ChatGPT.latest.json
          test -s 'versions/POD_ChatGPT统一工作台_V1.6.5.txt'
      - name: Publish and self-clean
        shell: bash
        run: |
          git config user.name "Kagura Update Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .pod_release/v165_final
          rm -f .github/workflows/pod_publish_v165_final.yml
          git add -A POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT.history.json versions .pod_release .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "release: POD ChatGPT V1.6.5 event-driven create-image detection"
          git push
