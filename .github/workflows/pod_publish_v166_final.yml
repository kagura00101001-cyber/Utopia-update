name: POD publish V1.6.6 final

on:
  push:
    paths:
      - '.pod_release/v166_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.6.5 to V1.6.6
        run: python .pod_release/v166_final/patch_v166.py

      - name: Validate V1.6.6 release
        shell: bash
        run: |
          set -euo pipefail
          node --check POD_ChatGPT.user.js
          grep -q '^// @name         ChatGPT服装POD统一工作台 V1.2.2$' POD_ChatGPT.user.js
          grep -q '^// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.6$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.6$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.6$' POD_ChatGPT.meta.js
          grep -q "const APP_VERSION = '1.6.6';" POD_ChatGPT.user.js
          grep -Fq 'async function waitCreateItemBounded(' POD_ChatGPT.user.js
          grep -Fq 'const info=await waitCreateItemBounded(plus,before,5200,180);' POD_ChatGPT.user.js
          ! grep -Fq 'function createWatcher(' POD_ChatGPT.user.js
          ! grep -Fq 'watcher.promise' POD_ChatGPT.user.js
          ! grep -Fq 'observer.observe(document.body||document.documentElement' POD_ChatGPT.user.js
          ! grep -Fq 'findCreateItemFallback' POD_ChatGPT.user.js
          grep -Fq 'const pathBefore=location.pathname;let last;' POD_ChatGPT.user.js
          grep -Fq 'isSidebarLike' POD_ChatGPT.user.js
          python - <<'PY'
          import json
          from pathlib import Path
          s = Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          a = s.index('  function updateStylePanel(){')
          b = s.index('\n\n  function renderWorkspace(){', a)
          assert 'updateTemplateWorkflowFolderLabel()' not in s[a:b]
          assert 'async function waitUploads(' in s
          assert 'async function sendPrompt(' in s
          assert 'async function waitGeneration(' in s
          assert 'async function processBatch()' in s
          for p in ['POD_ChatGPT.latest.json', 'POD_ChatGPT_latest.json']:
              with open(p, encoding='utf-8') as f:
                  assert json.load(f)['version'] == '1.6.6', p
          with open('POD_ChatGPT.history.json', encoding='utf-8') as f:
              h = json.load(f)
          assert h['versions'][0]['version'] == '1.6.6'
          assert h['versions'][1]['version'] == '1.6.5'
          PY

      - name: Archive V1.6.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions
          cp POD_ChatGPT.user.js 'versions/POD_ChatGPT统一工作台_V1.6.6.txt'

      - name: Publish official files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf .pod_release/v166_final
          rm -f .github/workflows/pod_publish_v166_final.yml
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json versions .pod_release .github/workflows
          git commit -m 'release: POD ChatGPT V1.6.6 performance regression fix'
          git push origin HEAD:main
