name: Ozon Complaint Update Test

on:
  push:
    paths:
      - '.github/workflows/ozon-complaint-update-test.yml'

permissions:
  contents: write

jobs:
  bump-ozon-complaint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump V1.1.0 to V1.1.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('Ozon_Complaint.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @name:zh-CN   Ozon 自动投诉 V1.1.0', '// @name:zh-CN   Ozon 自动投诉 V1.1.1', 1)
          s = s.replace('// @version      1.1.0', '// @version      1.1.1', 1)
          s = s.replace("const VERSION = '1.1.0';", "const VERSION = '1.1.1';", 1)
          p.write_text(s, encoding='utf-8')

          manifest = {
              'version': '1.1.1',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_Complaint.user.js',
              'changelog': [
                  '热更新链路测试：版本从 V1.1.0 升级到 V1.1.1',
                  '本次只更新版本标识与更新说明，不修改自动投诉业务逻辑',
                  '用于验证“检查更新 → 打开安装页 → Tampermonkey 覆盖更新”的完整流程'
              ]
          }
          Path('Ozon_Complaint.latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit updated files
        shell: bash
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Ozon_Complaint.user.js Ozon_Complaint.latest.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'test: bump Ozon complaint script to V1.1.1'
          git push
