name: POD publish V1.5.3

on:
  issues:
    types: [opened]
  push:
    paths:
      - '.pod_release/v153/TRIGGER'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event_name == 'push' || github.event.issue.title == '[internal] publish POD V1.5.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .pod_release/v153/part_*.b64 > /tmp/pod_v153_release.tgz.b64
          echo 'e0895b079d598c57a0f06b28bf32929b9716e324d1d79f01fb7dfcb5c0180d5e  /tmp/pod_v153_release.tgz.b64' | sha256sum -c -
          base64 -d /tmp/pod_v153_release.tgz.b64 > /tmp/pod_v153_release.tgz
          echo '9dc6e84bf26f308fa46e8fccdae7729004131e47890859a2f3929db6f8e4514a  /tmp/pod_v153_release.tgz' | sha256sum -c -
          tar -xzf /tmp/pod_v153_release.tgz -C .

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          node --check POD_ChatGPT.user.js
          grep -q '^// @version      1.5.3$' POD_ChatGPT.user.js
          grep -q '^// @version      1.5.3$' POD_ChatGPT.meta.js
          python - <<'PY'
          import json
          for p in ['POD_ChatGPT.latest.json','POD_ChatGPT_latest.json']:
              with open(p, encoding='utf-8') as f:
                  assert json.load(f)['version'] == '1.5.3', p
          with open('POD_ChatGPT.history.json', encoding='utf-8') as f:
              h=json.load(f)
          assert h['versions'][0]['version'] == '1.5.3'
          PY
          echo '3529eaddd3667604ae0585b5c81803cc53a50be78669946dfb18b7b4f9a2388a  POD_ChatGPT.user.js' | sha256sum -c -
          echo 'f7254843046a011d65611beaa894c830ba22843204e477d8e40878b48d742ed2  POD_ChatGPT.meta.js' | sha256sum -c -
          echo 'e9606426105d287e42a7e9226e18303dc3b880c985b3ba5a66972b8af6068472  POD_ChatGPT.latest.json' | sha256sum -c -
          echo '20d630d9610098335fa4651e55f671f97ab8b31be1bfa9db9932797a321105a7  POD_ChatGPT_latest.json' | sha256sum -c -
          echo '4965e05123d8823d1b6b2ac5c14ff0104aa21bd37ac0368cea369b08f62cd400  POD_ChatGPT.history.json' | sha256sum -c -

      - name: Commit V1.5.3 and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .pod_release/v153
          git rm .github/workflows/pod_publish_v153.yml
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json
          git commit -m 'release: POD ChatGPT V1.5.3'
          git push origin HEAD:main

      - name: Close trigger issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh issue close "$ISSUE_NUMBER" -R "$GH_REPO" --reason completed
