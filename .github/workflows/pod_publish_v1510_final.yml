name: POD publish V1.5.10 final

on:
  push:
    branches: [main]
    paths:
      - '.pod_release/v1510/READY'

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'build: trigger POD V1.5.10 final publish'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V1.5.10 patch from fixed V1.5.8 stable core
        run: python .pod_release/v1510/patch_v1510.py

      - name: Syntax and metadata validation
        shell: bash
        run: |
          node --check POD_ChatGPT.user.js
          python - <<'PY'
          import json, re
          from pathlib import Path
          user = Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          meta = Path('POD_ChatGPT.meta.js').read_text(encoding='utf-8')
          latest = json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))
          latest2 = json.loads(Path('POD_ChatGPT_latest.json').read_text(encoding='utf-8'))
          history = json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert re.search(r'^// @version\s+1\.5\.10$', user, re.M)
          assert re.search(r'^// @version\s+1\.5\.10$', meta, re.M)
          assert "const APP_VERSION = '1.5.10';" in user
          assert latest['version'] == '1.5.10' == latest2['version']
          assert history['versions'][0]['version'] == '1.5.10'
          assert history['versions'][0]['status'] == 'current'
          assert any(v.get('version') == '1.5.8' and v.get('status') == 'stable' for v in history['versions'])
          assert 'function kaguraWaitComposerStable' in user
          assert "const stableComposer=await kaguraWaitComposerStable(15000,900)" in user
          assert '创建图片模式已确认，等待ChatGPT Composer重载稳定' in user
          assert 'Ozon_ChatGPT' not in '\n'.join(latest['changelog'])
          archive = Path('versions/POD_ChatGPT统一工作台_V1.5.10.txt')
          assert archive.exists() and archive.read_text(encoding='utf-8') == user
          print('V1.5.10 metadata + archive assertions: PASS')
          PY
          git diff --check

      - name: Protect Ozon and generic updater files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'POD_ChatGPT.user.js',
              'POD_ChatGPT.meta.js',
              'POD_ChatGPT.latest.json',
              'POD_ChatGPT_latest.json',
              'POD_ChatGPT.history.json',
              'versions/POD_ChatGPT统一工作台_V1.5.10.txt',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit('Unexpected files changed: ' + ', '.join(sorted(unexpected)))
          print('POD-only change boundary: PASS')
          PY

      - name: Commit formal V1.5.10 release
        shell: bash
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.10.txt'
          git commit -m 'release: POD ChatGPT V1.5.10 composer stability adaptation'
          git push origin HEAD:main

      - name: Cleanup one-time release assets
        shell: bash
        run: |
          git rm -f .pod_release/v1510/READY .pod_release/v1510/patch_v1510.py .github/workflows/pod_publish_v1510_final.yml
          git commit -m 'chore: cleanup POD V1.5.10 release assets'
          git push origin HEAD:main
