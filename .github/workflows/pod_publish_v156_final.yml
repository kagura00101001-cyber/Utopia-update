name: POD publish V1.5.6 final

on:
  push:
    paths:
      - '.pod_release/v156_final/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch release files
        shell: bash
        run: |
          if [ ! -f .pod_release/v156_final/patch_v156.py ]; then
            echo 'publisher already cleaned; nothing to do'
            exit 0
          fi
          python .pod_release/v156_final/patch_v156.py
          node --check POD_ChatGPT.user.js
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          assert '// @name         ChatGPT服装POD统一工作台 V1.2.2' in s
          assert '// @version      1.5.6' in s
          assert "const APP_VERSION = '1.5.6';" in s
          assert 'gapRecoveryNeed=30000' in s
          assert '检测到运行计时断层' in s
          assert '检测到浏览器休眠/后台节流断层' not in s
          assert '已撤回开发版' in s
          assert 'function flattenPromptForComposer' in s
          assert 'function promptLightMatches' in s
          assert 'findCreateNearPlusLocal' not in s
          assert 'findCreateNearPlusFallback' not in s
          h=json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert h['versions'][0]['version']=='1.5.6'
          assert all(v.get('status')=='withdrawn' for v in h['versions'] if str(v.get('version','')).startswith('1.6.'))
          assert all(v.get('notes') and '已撤回开发版' in v['notes'][0] for v in h['versions'] if str(v.get('version','')).startswith('1.6.'))
          assert Path('versions/POD_ChatGPT统一工作台_V1.5.6.txt').exists()
          print('V1.5.6 regression checks passed')
          PY
      - name: Commit release and pin history
        shell: bash
        run: |
          if [ ! -f .pod_release/v156_final/patch_v156.py ]; then exit 0; fi
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json versions/POD_ChatGPT统一工作台_V1.5.6.txt
          git commit -m 'release: POD ChatGPT V1.5.6 gap recovery and version UI'
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_SHA="$RELEASE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('POD_ChatGPT.history.json')
          h=json.loads(p.read_text(encoding='utf-8'))
          sha=os.environ['RELEASE_SHA']
          v=h['versions'][0]
          assert v['version']=='1.5.6'
          v['commit']=sha
          v['install_url']=f'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/{sha}/POD_ChatGPT.user.js'
          p.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add POD_ChatGPT.history.json
          git commit -m 'chore: pin POD V1.5.6 history link'
          git rm -r .pod_release/v156_final .github/workflows/pod_publish_v156_final.yml
          git commit -m 'chore: clean POD V1.5.6 publisher'
          git push
