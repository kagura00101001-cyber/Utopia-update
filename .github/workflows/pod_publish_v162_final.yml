name: POD publish V1.6.2 final

on:
  push:
    paths:
      - '.pod_release/v162_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.6.1 to V1.6.2
        shell: bash
        run: |
          set -euo pipefail
          python .pod_release/v162_final/patch_v162.py

      - name: Validate V1.6.2 release
        shell: bash
        run: |
          set -euo pipefail
          node --check POD_ChatGPT.user.js
          grep -q '^// @name         ChatGPT服装POD统一工作台 V1.2.2$' POD_ChatGPT.user.js
          grep -q '^// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.2$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.2$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.2$' POD_ChatGPT.meta.js
          grep -q "const APP_VERSION = '1.6.2';" POD_ChatGPT.user.js
          grep -Fq 'function menuRootsAfterPlus(before,plus)' POD_ChatGPT.user.js
          grep -Fq '创建图片入口错误：检测到会话跳转' POD_ChatGPT.user.js
          grep -Fq '替换人物|人物替换|换人物' POD_ChatGPT.user.js
          grep -Fq "const root=findComposer();if(!(root instanceof Element))return null;" POD_ChatGPT.user.js
          python - <<'PY'
          import json
          for p in ['POD_ChatGPT.latest.json','POD_ChatGPT_latest.json']:
              with open(p, encoding='utf-8') as f:
                  assert json.load(f)['version'] == '1.6.2', p
          with open('POD_ChatGPT.history.json', encoding='utf-8') as f:
              h = json.load(f)
          assert h['versions'][0]['version'] == '1.6.2'
          assert h['versions'][1]['version'] == '1.6.1'
          PY

      - name: Publish official files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .pod_release/v162_final
          rm -f .github/workflows/pod_publish_v162_final.yml
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json .pod_release .github/workflows
          git commit -m 'release: POD ChatGPT V1.6.2 create-image entry fix'
          git push origin HEAD:main
