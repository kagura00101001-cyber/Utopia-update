name: POD publish V1.5.8 final

on:
  push:
    paths:
      - '.pod_release/v158/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.5.8
        run: python .pod_release/v158/patch_v158.py

      - name: Syntax check
        run: node --check POD_ChatGPT.user.js

      - name: Release assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          assert '// @name         ChatGPT服装POD统一工作台 V1.2.2' in s
          assert '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.5.8' in s
          assert "const APP_VERSION = '1.5.8';" in s
          assert 'class CreateModeRetryableError' in s
          assert 'function hasCreateChipLoose()' in s
          assert 'function createModePresent()' in s
          assert 'function recentCreateModeProof' in s
          assert "kind:'create-refresh'" in s
          assert 'createRefreshCount' in s
          assert '创建图片模式连续3次真实激活失败' in s
          assert "for(let click=1;click<=2;click++)" in s
          assert '完整观察期结束且严格全文校验确认提示词仍完整，才允许第二次点击' in s
          assert 'function flattenPromptForComposer' in s
          assert '检测到运行计时断层' in s
          latest=json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))
          hist=json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert latest['version']=='1.5.8'
          assert hist['versions'][0]['version']=='1.5.8'
          assert hist['versions'][0]['status']=='current'
          assert Path('versions/POD_ChatGPT统一工作台_V1.5.8.txt').exists()
          print('release assertions passed')
          PY
          if git diff --name-only | grep -q '^Ozon_ChatGPT'; then
            echo 'ERROR: Ozon stable file was touched'
            exit 1
          fi

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.8.txt'
          git commit -m 'release: POD ChatGPT V1.5.8 create-mode recovery stabilization'
          RELEASE_SHA="$(git rev-parse HEAD)"
          python - "$RELEASE_SHA" <<'PY'
          from pathlib import Path
          import sys
          sha=sys.argv[1]
          p=Path('POD_ChatGPT.history.json')
          s=p.read_text(encoding='utf-8')
          if '__RELEASE_COMMIT__' not in s:
              raise SystemExit('release placeholder missing')
          p.write_text(s.replace('__RELEASE_COMMIT__',sha),encoding='utf-8')
          PY
          git add POD_ChatGPT.history.json
          git rm -r .pod_release/v158 .github/workflows/pod_publish_v158.yml
          git commit -m 'chore: finalize POD V1.5.8 release metadata'
          git push origin HEAD:main
