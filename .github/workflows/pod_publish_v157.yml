name: POD publish V1.5.7 final

on:
  push:
    paths:
      - '.pod_release/v157/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch V1.5.7
        run: python .pod_release/v157/patch_v157.py
      - name: Syntax check
        run: node --check POD_ChatGPT.user.js
      - name: Regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = '1.5.7';" in s
          assert 'function sendReadySnapshot(' in s
          assert 'function sendReadyDiagnostic(' in s
          assert 'async function recoverReadyToSend(' in s
          assert '发送前安全恢复' in s
          assert '发送前检查连续未通过' in s
          assert 'flattenPromptForComposer' in s
          assert 'async function sendPrompt(' in s
          assert 'async function waitGenerated(' in s
          assert 'async function processBatch()' in s
          assert 'document.querySelectorAll(CREATE_CLICK_SELECTOR)' not in s
          latest=json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='1.5.7'
          hist=json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert hist['versions'][0]['version']=='1.5.7'
          assert hist['versions'][0]['status']=='current'
          assert Path('versions/POD_ChatGPT统一工作台_V1.5.7.txt').exists()
          print('V1.5.7 regression checks passed')
          PY
      - name: Commit release
        run: |
          git config user.name "Kagura Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.7.txt'
          git commit -m "release: POD ChatGPT V1.5.7 send-ready recovery diagnostics"
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_SHA="$RELEASE_SHA" python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('POD_ChatGPT.history.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          sha=os.environ['RELEASE_SHA']
          v=d['versions'][0]
          assert v['version']=='1.5.7'
          v['commit']=sha
          v['install_url']=f'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/{sha}/POD_ChatGPT.user.js'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add POD_ChatGPT.history.json
          git commit -m "chore: finalize POD V1.5.7 history metadata"
          git push
