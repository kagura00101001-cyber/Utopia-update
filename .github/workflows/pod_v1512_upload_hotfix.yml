name: POD V1.5.12 upload menu hotfix

on:
  push:
    branches: [main]
    paths:
      - '.pod_release/v1512-upload-hotfix/TRIGGER'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate POD V1.5.12
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('POD_ChatGPT.user.js')
          s = p.read_text(encoding='utf-8')

          required = [
              "// @version      1.5.11",
              "const APP_VERSION = '1.5.11';",
              "function findFileInput(){",
              "async function ensureFileInput(){",
              "async function uploadFiles(files,label){",
              "async function uploadFilesPlain(files,label){",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('hotfix precondition failed: ' + repr(missing))

          s = s.replace('// @name:zh-CN   Kagura POD智能创意中心 V1.5.11', '// @name:zh-CN   Kagura POD智能创意中心 V1.5.12', 1)
          s = s.replace('// @version      1.5.11', '// @version      1.5.12', 1)
          old_desc = '// @description  AI驱动的POD商品视觉生产系统：V1.5.11 修复参考素材队列升级后旧模板/Logo动作仍引用已删除函数导致启动失败；保留V1.5.10全部参考素材队列能力。'
          new_desc = '// @description  AI驱动的POD商品视觉生产系统：V1.5.12 修复ChatGPT新版“+ → 添加照片和文件”上传入口：优先命中当前Composer/新建文件控件，并在首次提交未触发上传时自动重走菜单链路。'
          if old_desc not in s:
              raise SystemExit('description precondition failed')
          s = s.replace(old_desc, new_desc, 1)
          s = s.replace('Kagura POD Studio V1.5.11\n   * ================================================================', 'Kagura POD Studio V1.5.12\n   * ================================================================', 1)
          anchor = ' * - V1.5.11 启动热修复：旧模板/Logo按钮兼容动作改接参考素材队列处理器，彻底移除 chooseTemplate/chooseLogo/clearLogo 未定义引用。\n'
          if anchor not in s:
              raise SystemExit('changelog anchor missing')
          s = s.replace(anchor, anchor + ' * - V1.5.12 上传热修复：适配ChatGPT新版“+ → 添加照片和文件”菜单，避免误用页面其它隐藏file input；首次提交未触发附件上传时自动重走一次菜单链路。\n', 1)
          s = s.replace("const APP_VERSION = '1.5.11';", "const APP_VERSION = '1.5.12';", 1)

          lines = s.splitlines()
          idx = next((i for i,x in enumerate(lines) if x.startswith('  function findFileInput(){')), None)
          if idx is None or idx + 1 >= len(lines) or not lines[idx+1].startswith('  async function ensureFileInput(){'):
              raise SystemExit('file input function block not found')
          replacement = r'''  function fileInputScore(i){
    if(!i||i.type!=='file'||i.disabled)return -99999;
    let score=0;
    const accept=String(i.accept||'').toLowerCase();
    const meta=[i.id,i.name,i.getAttribute('data-testid'),i.getAttribute('aria-label'),i.className].filter(Boolean).join(' ');
    if(/image|png|jpe?g|webp|\*/i.test(accept))score+=420;
    if(i.multiple)score+=100;
    if(/upload|file|attach|composer/i.test(meta))score+=260;
    if(i.closest('form[data-type="unified-composer"],[data-composer-surface="true"]'))score+=1200;
    if(i.closest('#kagura-pod-panel,nav,aside,[data-testid*="sidebar"],[data-testid*="library"]'))score-=1500;
    return score;
  }
  function findFileInput(opts={}){
    const composer=findComposer();
    let a=[...document.querySelectorAll('input[type="file"]')].filter(i=>!i.disabled&&i.getAttribute('aria-disabled')!=='true');
    if(opts.exclude)a=a.filter(i=>!opts.exclude.has(i));
    if(opts.composerOnly)a=a.filter(i=>composer&&composer.contains(i));
    a=a.map(i=>({i,score:fileInputScore(i)})).sort((x,y)=>y.score-x.score);
    if(!a.length)return null;
    if(opts.allowAny)return a[0].i;
    return a[0].score>0?a[0].i:null;
  }
  function findUploadMenuItem(){
    const re=/^(?:添加照片和文件|上传文件|从电脑上传|Add photos and files|Upload file|Upload from computer|Attach files)(?:\s|$)/i;
    const nodes=[...document.querySelectorAll('[role="menuitem"],button,[role="button"],label')]
      .filter(isVisible).filter(e=>!e.closest('#kagura-pod-panel')).filter(e=>re.test(plainText(e)));
    return nodes.sort((a,b)=>a.getBoundingClientRect().top-b.getBoundingClientRect().top)[0]||null;
  }
  async function ensureFileInput(opts={}){
    const forceMenu=Boolean(opts.forceMenu);
    const existing=new Set(document.querySelectorAll('input[type="file"]'));
    if(!forceMenu){const direct=findFileInput({composerOnly:true});if(direct)return direct;}
    let menu=findUploadMenuItem();
    if(!menu){
      const plus=findPlus()||document.querySelector('button[data-testid*="composer-plus"],button[aria-label*="添加照片"],button[aria-label*="添加文件"],button[aria-label*="Attach"],button[aria-label*="Upload"]');
      if(plus){smartClick(plus);await sleep(450);}
      menu=await waitUntil(()=>findUploadMenuItem(),3500,120,true);
    }
    let input=findFileInput({exclude:existing,allowAny:true})||findFileInput({composerOnly:true});
    if(input)return input;
    if(menu){
      smartClick(menu);
      await sleep(450);
      input=await waitUntil(()=>findFileInput({exclude:existing,allowAny:true})||findFileInput({composerOnly:true})||findFileInput(),4500,120,true);
      if(input)return input;
    }
    throw new Error('未找到ChatGPT当前对话的上传控件；已尝试“+ → 添加照片和文件”，页面结构可能变化');
  }
  function assignFilesToInput(input,files){
    const dt=new DataTransfer();
    files.forEach(f=>dt.items.add(f));
    input.files=dt.files;
    input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));
    input.dispatchEvent(new Event('change',{bubbles:true,composed:true}));
  }
  async function waitUploadKickoff(before,timeoutMs=7000){
    return Boolean(await waitUntil(()=>{const st=uploadState();return st.failed||st.uploading||st.count>before||st.previewTotal>before;},timeoutMs,250,true));
  }'''.splitlines()
          lines[idx:idx+2] = replacement
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          lines = s.splitlines()
          idx = next((i for i,x in enumerate(lines) if x.startswith('  async function uploadFiles(files,label){')), None)
          if idx is None:
              raise SystemExit('uploadFiles line not found')
          lines[idx:idx+1] = r'''  async function uploadFiles(files,label){
    if(!files.length)return countAttachments();
    const before=countAttachments(),expected=before+files.length;
    let input=await ensureFileInput();
    assignFilesToInput(input,files);
    let kicked=await waitUploadKickoff(before,7000);
    if(!kicked){
      log(`${label}首次提交未触发附件上传，自动重走“+ → 添加照片和文件”链路`,'warn');
      input=await ensureFileInput({forceMenu:true});
      assignFilesToInput(input,files);
      kicked=await waitUploadKickoff(before,7000);
      if(!kicked)throw new Error(`${label}提交后未触发ChatGPT附件上传；已自动重试一次`);
    }
    log(`已提交上传${label}：${files.map(f=>f.name).join('、')}`);
    return waitUploads(expected,label);
  }'''.splitlines()
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          lines = s.splitlines()
          idx = next((i for i,x in enumerate(lines) if x.startswith('  async function uploadFilesPlain(files,label){')), None)
          if idx is None:
              raise SystemExit('uploadFilesPlain line not found')
          lines[idx:idx+1] = r'''  async function uploadFilesPlain(files,label){
    if(!files.length)return countAttachments();
    const before=countAttachments(),expected=before+files.length;
    let input=await ensureFileInput();
    assignFilesToInput(input,files);
    let kicked=await waitUploadKickoff(before,7000);
    if(!kicked){
      log(`${label}首次提交未触发附件上传，自动重走“+ → 添加照片和文件”链路`,'warn');
      input=await ensureFileInput({forceMenu:true});
      assignFilesToInput(input,files);
      kicked=await waitUploadKickoff(before,7000);
      if(!kicked)throw new Error(`${label}提交后未触发ChatGPT附件上传；已自动重试一次`);
    }
    log(`已提交上传${label}：${files.map(f=>f.name).join('、')}`);
    return waitUploadsPlain(expected,label);
  }'''.splitlines()
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')

          if "const APP_VERSION = '1.5.12';" not in s:
              raise SystemExit('APP_VERSION patch failed')
          if 'function findUploadMenuItem()' not in s or 'waitUploadKickoff' not in s:
              raise SystemExit('upload hotfix functions missing')
          p.write_text(s, encoding='utf-8')

          end = s.index('// ==/UserScript==') + len('// ==/UserScript==')
          Path('POD_ChatGPT.meta.js').write_text(s[:end] + '\n', encoding='utf-8')

          notes = [
              '修复 V1.5.11 显示“上传参考素材”但实际只打开 ChatGPT “+”菜单、附件没有进入输入框的问题。',
              '上传控件查找改为优先当前 Composer，并优先使用打开“+”后新出现的 file input，避免误命中页面其它隐藏上传控件。',
              '适配新版菜单“添加照片和文件 / 从电脑上传”；首次文件事件提交 7 秒内未触发上传时，自动重走一次“+ → 添加照片和文件”链路并重新提交。',
              '批量生图与风格反推共用同一修复；继续保留参考素材顺序、Attachment Manifest、创建图片恢复和 at-most-once 发送保护。'
          ]
          manifest = {
              'version': '1.5.12',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'download_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'published_at': '2026-09-07',
              'changelog': notes,
          }
          text = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          Path('POD_ChatGPT.latest.json').write_text(text, encoding='utf-8')
          Path('POD_ChatGPT_latest.json').write_text(text, encoding='utf-8')

          hp = Path('POD_ChatGPT.history.json')
          hist = json.loads(hp.read_text(encoding='utf-8'))
          for item in hist.get('versions', []):
              if item.get('version') == '1.5.11' and item.get('status') == 'current':
                  item['status'] = 'stable'
          hist['title'] = 'Kagura POD Studio'
          hist['versions'] = [x for x in hist.get('versions', []) if x.get('version') != '1.5.12']
          hist['versions'].insert(0, {
              'version': '1.5.12',
              'date': '2026-09-07',
              'status': 'current',
              'notes': notes,
              'archive_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/versions/POD_ChatGPT统一工作台_V1.5.12.txt',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
          })
          hp.write_text(json.dumps(hist, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('versions/POD_ChatGPT统一工作台_V1.5.12.txt').write_text(s, encoding='utf-8')
          PY
          node --check POD_ChatGPT.user.js
          grep -q "@version      1.5.12" POD_ChatGPT.user.js
          grep -q "const APP_VERSION = '1.5.12';" POD_ChatGPT.user.js
          grep -q 'function findUploadMenuItem()' POD_ChatGPT.user.js
          grep -q '自动重走“+ → 添加照片和文件”链路' POD_ChatGPT.user.js
      - name: Publish hotfix and cleanup trigger
        shell: bash
        run: |
          rm -f .pod_release/v1512-upload-hotfix/TRIGGER
          rm -f .github/workflows/pod_v1512_upload_hotfix.yml
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: release Kagura POD Studio V1.5.12 upload menu hotfix'
          git push origin HEAD:main
