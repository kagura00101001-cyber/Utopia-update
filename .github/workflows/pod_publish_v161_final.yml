name: POD publish V1.6.1 final

on:
  push:
    paths:
      - '.pod_release/v161_final/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.6.0 to V1.6.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('POD_ChatGPT.user.js')
          s = p.read_text(encoding='utf-8')

          required = [
              '// @name         ChatGPT服装POD统一工作台 V1.2.2',
              '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.0',
              '// @version      1.6.0',
              "const APP_VERSION = '1.6.0';",
              '  function findCreateItem(){',
              '  function hasCreateChip(){',
              '  async function activateCreate(){'
          ]
          for marker in required:
              if s.count(marker) != 1:
                  raise SystemExit(f'expected exactly one marker: {marker!r}, got {s.count(marker)}')

          s = s.replace('// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.0', '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.1', 1)
          s = s.replace('// @version      1.6.0', '// @version      1.6.1', 1)
          old_desc = '// @description  服装POD统一工作台：V1.6.0 正式统一三大流程名称；视觉风格解析新增独立输出文件夹；新增母版驱动的生产文件设计流程。'
          new_desc = '// @description  服装POD统一工作台：V1.6.1 修复长对话中“添加创建图片模式”阶段因全页DOM高频扫描导致浏览器无响应的问题。'
          if s.count(old_desc) != 1:
              raise SystemExit('unexpected V1.6.0 description count')
          s = s.replace(old_desc, new_desc, 1)
          s = s.replace("const APP_VERSION = '1.6.0';", "const APP_VERSION = '1.6.1';", 1)

          anchor = ' * - V1.6.0 流程体系升级：一级流程正式命名为“图片生成自动化 / 视觉风格解析 / 生产文件设计”；视觉风格解析与生产文件设计各自拥有独立输出文件夹；生产文件设计复用母版Excel驱动的动态步骤、自动/手动连续执行、项目保存/恢复与同对话上下文机制。'
          note = ' * - V1.6.1 性能修复：创建图片菜单项只在当前可见菜单/弹层内检索；创建图片标签只在输入框区域检测，并降低轮询频率，避免长对话全页DOM重复布局导致浏览器无响应。\n'
          if s.count(anchor) != 1:
              raise SystemExit('V1.6.0 changelog anchor missing')
          s = s.replace(anchor, note + anchor, 1)

          start = s.index('  function findCreateItem(){')
          end = s.index('  async function activateCreate(){', start)
          new_helpers = r'''  function findCreateItem(){const re=/(创建图片|创作图片|生成图片|create\s*image|generate\s*image)/i;const cand=[];const roots=visibleMenuRoots();for(const root of roots){for(const e of root.querySelectorAll('button,[role="button"],[role="menuitem"],[role="option"],[data-radix-collection-item],a,div,span')){if(!isVisible(e)||insideMessage(e)||e.closest('#kagura-pod-panel'))continue;const tx=plainText(e),aria=e.getAttribute('aria-label')||'';if(!re.test(`${tx} ${aria}`)||tx.length>240)continue;const r=e.getBoundingClientRect();if(r.width<70||r.height<22||r.height>180)continue;let score=700;if(/^(创建图片|创作图片|生成图片|create\s*image|generate\s*image)(?:\s|$)/i.test(tx))score+=1800;if(/可视化/.test(tx))score+=1000;if(e.matches('button,[role="menuitem"],[role="option"],[role="button"]'))score+=420;score+=700;cand.push({e,score,tx,r});}}cand.sort((a,b)=>b.score-a.score);return cand[0]||null;}
  function hasCreateChip(){const c=findComposer(),ed=findPromptEditor(),er=ed?.getBoundingClientRect(),re=/^(创建图片|创作图片|生成图片|create\s*image|generate\s*image)$/i;if(!(c instanceof Element))return false;for(const e of c.querySelectorAll('button,[role="button"],[data-testid*="chip"],[data-testid*="tool"],div,span')){if(!isVisible(e)||insideMessage(e)||e.closest('#kagura-pod-panel'))continue;if(!re.test(plainText(e)))continue;const r=e.getBoundingClientRect();if(!er||r.bottom>=er.top-140&&r.top<=er.bottom+80)return true;}return false;}
'''
          s = s[:start] + new_helpers + s[end:]

          s = s.replace("waitUntil(()=>findCreateItem()?.e,4500,150)", "waitUntil(()=>findCreateItem()?.e,4500,300)", 1)
          s = s.replace("waitUntil(()=>findCreateItem()?.e,3500,150)", "waitUntil(()=>findCreateItem()?.e,3500,300)", 1)
          s = s.replace("waitUntil(()=>hasCreateChip(),5000,220)", "waitUntil(()=>hasCreateChip(),5000,350)", 1)

          if s.count("waitUntil(()=>findCreateItem()?.e,4500,300)") != 1:
              raise SystemExit('first create-item polling replacement failed')
          if s.count("waitUntil(()=>findCreateItem()?.e,3500,300)") != 1:
              raise SystemExit('second create-item polling replacement failed')
          if s.count("waitUntil(()=>hasCreateChip(),5000,350)") != 1:
              raise SystemExit('create-chip polling replacement failed')
          if "for(const root of [c,document])" in s:
              raise SystemExit('legacy full-document create-chip scan still present')
          legacy_full_scan = "for(const e of document.querySelectorAll('button,[role=\"button\"],[role=\"menuitem\"],[role=\"option\"],[data-radix-collection-item],div,span'))"
          if legacy_full_scan in s:
              raise SystemExit('legacy full-document create-item scan still present')

          p.write_text(s, encoding='utf-8')

          header_end = s.index('// ==/UserScript==') + len('// ==/UserScript==')
          Path('POD_ChatGPT.meta.js').write_text(s[:header_end] + '\n', encoding='utf-8')

          changelog = [
              '修复长对话中“添加创建图片模式”阶段浏览器无响应：创建图片菜单项只在当前可见菜单/弹层内检索，不再高频全页扫描 div/span。',
              '创建图片模式标签检测限制在输入框 composer 区域，不再对整个 document 做第二轮扫描。',
              '创建图片菜单与标签轮询频率降低，减少强制布局与主线程压力。',
              '仅修改创建图片模式定位性能；上传、发送确认、生图检测、下载隔离和暂停恢复核心保持不变。'
          ]
          latest = {
              'version': '1.6.1',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'download_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'published_at': '2026-08-25',
              'changelog': changelog
          }
          latest_text = json.dumps(latest, ensure_ascii=False, indent=2) + '\n'
          Path('POD_ChatGPT.latest.json').write_text(latest_text, encoding='utf-8')
          Path('POD_ChatGPT_latest.json').write_text(latest_text, encoding='utf-8')

          hp = Path('POD_ChatGPT.history.json')
          h = json.loads(hp.read_text(encoding='utf-8'))
          if h.get('versions', [{}])[0].get('version') != '1.6.0':
              raise SystemExit('history head is not V1.6.0')
          h['versions'].insert(0, {'version': '1.6.1', 'date': '2026-08-25', 'notes': changelog})
          hp.write_text(json.dumps(h, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate V1.6.1 release
        shell: bash
        run: |
          set -euo pipefail
          node --check POD_ChatGPT.user.js
          grep -q '^// @name         ChatGPT服装POD统一工作台 V1.2.2$' POD_ChatGPT.user.js
          grep -q '^// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.1$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.1$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.1$' POD_ChatGPT.meta.js
          grep -q "const APP_VERSION = '1.6.1';" POD_ChatGPT.user.js
          grep -q 'const roots=visibleMenuRoots()' POD_ChatGPT.user.js
          grep -q "c.querySelectorAll('button,\[role=\"button\"\],\[data-testid\*=\"chip\"\],\[data-testid\*=\"tool\"\],div,span')" POD_ChatGPT.user.js
          ! grep -Fq 'for(const root of [c,document])' POD_ChatGPT.user.js
          python - <<'PY'
          import json
          for p in ['POD_ChatGPT.latest.json','POD_ChatGPT_latest.json']:
              with open(p, encoding='utf-8') as f:
                  assert json.load(f)['version'] == '1.6.1', p
          with open('POD_ChatGPT.history.json', encoding='utf-8') as f:
              h = json.load(f)
          assert h['versions'][0]['version'] == '1.6.1'
          assert h['versions'][1]['version'] == '1.6.0'
          PY

      - name: Publish official files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .pod_release/v161_final
          rm -f .github/workflows/pod_publish_v161_final.yml
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json .pod_release .github/workflows
          git commit -m 'release: POD ChatGPT V1.6.1 performance fix'
          git push origin HEAD:main
