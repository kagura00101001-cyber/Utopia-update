name: POD V1.5.16 Refusal Retry

on:
  push:
    branches: [main]
    paths:
      - '.pod_release/v1516_refusal_retry/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch
        run: |
          cp POD_ChatGPT.user.js /tmp/POD_ChatGPT.user.js.before
          python .pod_release/v1516_refusal_retry/patch.py

      - name: Verify
        run: |
          node --check POD_ChatGPT.user.js
          python - <<'PY'
          from pathlib import Path
          import json
          before=Path('/tmp/POD_ChatGPT.user.js.before').read_text(encoding='utf-8')
          after=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          def span(text,start,end):
              a=text.index(start); b=text.index(end,a); return text[a:b]
          assert span(before,'  function findFileInput(){','  function plainText(e){') == span(after,'  function findFileInput(){','  function plainText(e){')
          assert span(before,'  function plainText(e){','  function setNativeValue') == span(after,'  function plainText(e){','  function setNativeValue')
          assert span(before,'  function setNativeValue','  function assistantMessageText') == span(after,'  function setNativeValue','  function assistantMessageText')
          assert "// @version      1.5.16" in after
          assert "const APP_VERSION = '1.5.16';" in after
          assert 'class GenerationRefusalError extends Error' in after
          assert 'function detectGenerationRefusal' in after
          assert 'refusalRetries=1' in after
          assert "t.status='skipped'" in after
          assert '自动重试 1/1' in after
          assert '不修改提示词' in after
          assert json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))['version']=='1.5.16'
          hist=json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert hist['versions'][0]['version']=='1.5.16' and hist['versions'][0]['status']=='current'
          assert Path('versions/POD_ChatGPT统一工作台_V1.5.16.txt').read_text(encoding='utf-8')==after
          print('V1.5.16 assertions PASS')
          PY
          git diff --check

      - name: Boundary
        run: |
          python - <<'PY'
          import subprocess
          allowed={'POD_ChatGPT.user.js','POD_ChatGPT.meta.js','POD_ChatGPT.latest.json','POD_ChatGPT_latest.json','POD_ChatGPT.history.json','versions/POD_ChatGPT统一工作台_V1.5.16.txt'}
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          bad=changed-allowed
          if bad: raise SystemExit('Unexpected files: '+', '.join(sorted(bad)))
          print('POD-only boundary PASS')
          PY

      - name: Publish
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.16.txt'
          git commit -m 'release: Kagura POD Studio V1.5.16 refusal retry once then skip'
          git push origin HEAD:main

      - name: Cleanup
        run: |
          git rm -f .pod_release/v1516_refusal_retry/READY .pod_release/v1516_refusal_retry/patch.py .github/workflows/pod_publish_v1516_refusal_retry.yml
          git commit -m 'chore: cleanup POD V1.5.16 publisher'
          git push origin HEAD:main
