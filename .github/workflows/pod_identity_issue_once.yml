name: One-time POD identity lock

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[internal] POD identity lock V1.2.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock userscript and meta identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ['POD_ChatGPT.user.js', 'POD_ChatGPT.meta.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              old = '// @name         ChatGPT服装POD统一工作台\n'
              new = '// @name         ChatGPT服装POD统一工作台 V1.2.2\n'
              if old not in s:
                  raise SystemExit(f'base @name not found in {name}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/pod_identity_issue_once.yml
      - name: Commit identity lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: lock POD Tampermonkey identity for in-place updates'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Identity lock applied; one-time workflow removed."
