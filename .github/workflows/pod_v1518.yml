name: POD V1518
on:
  push:
    paths:
      - '.pod_release/v1518_composer_attachment_guard/RUN'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          cp POD_ChatGPT.user.js /tmp/before.js
          python .pod_release/v1518_composer_attachment_guard/patch.py
      - name: Syntax
        run: node --check POD_ChatGPT.user.js
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('/tmp/before.js').read_text(encoding='utf-8')
          a=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          def s(t,x,y):
              i=t.index(x); j=t.index(y,i); return t[i:j]
          # Freeze proven upload/create core byte-for-byte.
          assert s(b,'  function findFileInput(){','  function plainText(e){')==s(a,'  function findFileInput(){','  function plainText(e){')
          assert s(b,'  function plainText(e){','  function setNativeValue')==s(a,'  function plainText(e){','  function setNativeValue')
          assert "const APP_VERSION = '1.5.18';" in a
          assert 'ensureComposerAttachmentsEmptyBeforeBatch' in a
          assert '下一批开始前检测到 ${residual} 个残留附件' in a
          assert 'await ensureComposerEmptyBeforeBatch();\n          await ensureComposerAttachmentsEmptyBeforeBatch();' in a
          assert '参考素材 ${handles.references.length} 张' in a
          assert 'GenerationRefusalError' in a
          latest=json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))
          assert latest['version']=='1.5.18'
          hist=json.loads(Path('POD_ChatGPT.history.json').read_text(encoding='utf-8'))
          assert hist['versions'][0]['version']=='1.5.18' and hist['versions'][0]['status']=='current'
          assert Path('versions/POD_ChatGPT统一工作台_V1.5.18.txt').read_text(encoding='utf-8')==a
          print('PASS')
          PY
          git diff --check
          python - <<'PY'
          import subprocess
          allowed={
            'POD_ChatGPT.user.js','POD_ChatGPT.meta.js','POD_ChatGPT.latest.json','POD_ChatGPT_latest.json','POD_ChatGPT.history.json','versions/POD_ChatGPT统一工作台_V1.5.18.txt'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          assert 'Ozon_ChatGPT.user.js' not in changed
          print('BOUNDARY PASS')
          PY
      - name: Publish
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.18.txt'
          git commit -m 'release: Kagura POD Studio V1.5.18 stale attachment guard'
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f .pod_release/v1518_composer_attachment_guard/RUN .pod_release/v1518_composer_attachment_guard/patch.py .github/workflows/pod_v1518.yml
          git commit -m 'chore: cleanup POD V1.5.18 publisher'
          git push origin HEAD:main
