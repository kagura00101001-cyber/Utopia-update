name: POD V1516
on:
  push:
    paths:
      - '.pod_release/v1516_refusal_retry/RUN'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp POD_ChatGPT.user.js /tmp/before.js && python .pod_release/v1516_refusal_retry/patch.py
      - run: node --check POD_ChatGPT.user.js
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          b=Path('/tmp/before.js').read_text(encoding='utf-8')
          a=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          def s(t,x,y):
              i=t.index(x);j=t.index(y,i);return t[i:j]
          assert s(b,'  function findFileInput(){','  function plainText(e){')==s(a,'  function findFileInput(){','  function plainText(e){')
          assert s(b,'  function plainText(e){','  function setNativeValue')==s(a,'  function plainText(e){','  function setNativeValue')
          assert "const APP_VERSION = '1.5.16';" in a
          assert 'GenerationRefusalError' in a and 'detectGenerationRefusal' in a
          assert "t.status='skipped'" in a and 'refusalRetries=1' in a
          assert json.loads(Path('POD_ChatGPT.latest.json').read_text(encoding='utf-8'))['version']=='1.5.16'
          print('PASS')
          PY
          git diff --check
      - name: Publish
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json 'versions/POD_ChatGPT统一工作台_V1.5.16.txt'
          git commit -m 'release: Kagura POD Studio V1.5.16 refusal retry once then skip'
          git push origin HEAD:main
      - name: Cleanup
        run: |
          git rm -f .pod_release/v1516_refusal_retry/READY .pod_release/v1516_refusal_retry/RUN .pod_release/v1516_refusal_retry/patch.py .github/workflows/pod_publish_v1516_refusal_retry.yml .github/workflows/pod_v1516.yml
          git commit -m 'chore: cleanup POD V1.5.16 publisher'
          git push origin HEAD:main
