# PR trigger after enabling base workflow
name: POD 3.2.1 PR repair publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pod321-pr-repair
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/pod-3.2.1-repair
          fetch-depth: 0

      - name: Rebuild 3.2.1 exactly from stable 3.2.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          user_path = Path('Ozon_ChatGPT.user.js')
          stable_archive = Path('versions/Ozon_ChatGPT批量生图下载器_V3.2.0.txt')
          meta_path = Path('Ozon_ChatGPT.meta.js')
          latest_path = Path('latest.json')
          history_path = Path('history.json')
          archive_321 = Path('versions/Ozon_ChatGPT批量生图下载器_V3.2.1.txt')

          if not stable_archive.exists():
              raise SystemExit('stable V3.2.0 archive missing')
          if user_path.read_bytes() != stable_archive.read_bytes():
              raise SystemExit('main userscript no longer matches archived V3.2.0 baseline')

          text = stable_archive.read_text(encoding='utf-8')
          replacements = [
              ('// @version      3.2.0', '// @version      3.2.1'),
              ("const CURRENT_VERSION = '3.2.0';", "const CURRENT_VERSION = '3.2.1';"),
              ("const APP_VERSION = '3.2.0';", "const APP_VERSION = '3.2.1';"),
              ("const KAGURA_MANUAL_VERSION = '3.2.0';", "const KAGURA_MANUAL_VERSION = '3.2.1';"),
              ('/* KAGURA_POD_STYLE_UPDATE_V320 */', '/* KAGURA_POD_STYLE_UPDATE_V321 */'),
              ('Kagura 手动更新检查 V3.2.0（POD统一热更新）', 'Kagura 手动更新检查 V3.2.1（POD统一热更新）'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing stable marker: {old}')
              text = text.replace(old, new, 1)

          changelog_pattern = re.compile(r"    const MODULE_CHANGELOG = \[\n.*?\n    \]\.join\('\\n'\);", re.S)
          changelog_replacement = """    const MODULE_CHANGELOG = [
      `V${APP_VERSION} 更新内容：`,
      '1. 基于 V3.2.0 稳定代码重新完成 V3.2.1 热更新发布链。',
      '2. 修复 user.js、meta.js、latest.json 与 history.json 版本不一致的问题。',
      '3. 启动更新检查、手动更新检查与界面版本号统一识别为 V3.2.1。',
      '4. 保留 V3.2.0 的全部业务逻辑、任务状态和本地配置兼容性，本版不引入新的生图流程改动。',
      '5. 新增 V3.2.1 正式版本归档，保留 V3.2.0 作为可回滚稳定基线。'
    ].join('\\n');"""
          text, n = changelog_pattern.subn(changelog_replacement, text, count=1)
          if n != 1:
              raise SystemExit('failed to replace MODULE_CHANGELOG')

          user_path.write_text(text, encoding='utf-8', newline='')
          archive_321.write_text(text, encoding='utf-8', newline='')

          meta = meta_path.read_text(encoding='utf-8')
          meta = re.sub(r'(?m)^// @version\s+\S+\s*$', '// @version      3.2.1', meta, count=1)
          meta_path.write_text(meta, encoding='utf-8', newline='')

          notes = [
              '基于 V3.2.0 稳定代码重新完成 V3.2.1 热更新发布链。',
              '修复 user.js、meta.js、latest.json 与 history.json 版本不一致的问题。',
              '启动更新检查、手动更新检查与界面版本号统一为 V3.2.1。',
              '保留 V3.2.0 全部业务逻辑和本地配置兼容性，本版不引入新的生图流程改动。',
              '新增 V3.2.1 正式版本归档，V3.2.0 继续保留作为回滚基线。',
          ]
          latest = {
              'version': '3.2.1',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_ChatGPT.user.js',
              'published_at': '2026-09-07',
              'changelog': notes,
          }
          latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          history = json.loads(history_path.read_text(encoding='utf-8'))
          versions = history.setdefault('versions', [])
          versions[:] = [v for v in versions if str(v.get('version', '')) != '3.2.1']
          versions.insert(0, {'version': '3.2.1', 'date': '2026-09-07', 'notes': notes})
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          raw = user_path.read_bytes()
          print('V3.2.1 bytes:', len(raw))
          print('V3.2.1 sha256:', hashlib.sha256(raw).hexdigest())
          PY

          node --check Ozon_ChatGPT.user.js

          python - <<'PY'
          from pathlib import Path
          import json, re
          user = Path('Ozon_ChatGPT.user.js').read_text(encoding='utf-8')
          meta = Path('Ozon_ChatGPT.meta.js').read_text(encoding='utf-8')
          latest = json.loads(Path('latest.json').read_text(encoding='utf-8'))
          history = json.loads(Path('history.json').read_text(encoding='utf-8'))
          checks = {
              'user @version': bool(re.search(r'(?m)^// @version\s+3\.2\.1\s*$', user)),
              'CURRENT_VERSION': "const CURRENT_VERSION = '3.2.1';" in user,
              'APP_VERSION': "const APP_VERSION = '3.2.1';" in user,
              'manual version': "const KAGURA_MANUAL_VERSION = '3.2.1';" in user,
              'meta @version': bool(re.search(r'(?m)^// @version\s+3\.2\.1\s*$', meta)),
              'latest version': latest.get('version') == '3.2.1',
              'history latest': bool(history.get('versions')) and history['versions'][0].get('version') == '3.2.1',
              'archive exists': Path('versions/Ozon_ChatGPT批量生图下载器_V3.2.1.txt').exists(),
          }
          failed = [k for k, ok in checks.items() if not ok]
          print(checks)
          if failed:
              raise SystemExit(f'release verification failed: {failed}')
          PY

          rm -f .github/workflows/pod321-release-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: complete Ozon ChatGPT 3.2.1 hot update'
          git push origin HEAD:release/pod-3.2.1-repair
