name: POD publish V1.6.9 final

on:
  push:
    paths:
      - '.pod_release/v169_final/READY'
      - '.pod_release/v169_final/READY_RETRY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V1.6.8 to V1.6.9
        run: python .pod_release/v169_final/patch_v169.py

      - name: Validate V1.6.9 release
        shell: bash
        run: |
          set -euo pipefail
          node --check POD_ChatGPT.user.js
          grep -q '^// @name         ChatGPT服装POD统一工作台 V1.2.2$' POD_ChatGPT.user.js
          grep -q '^// @name:zh-CN   ChatGPT服装POD统一工作台 V1.6.9$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.9$' POD_ChatGPT.user.js
          grep -q '^// @version      1.6.9$' POD_ChatGPT.meta.js
          grep -q "const APP_VERSION = '1.6.9';" POD_ChatGPT.user.js
          grep -Fq 'const TASK_LIST_RENDER_LIMIT=80;' POD_ChatGPT.user.js
          grep -Fq 'function updateHeartbeat()' POD_ChatGPT.user.js
          grep -Fq 'function createCandidateFromPointNode(' POD_ChatGPT.user.js
          grep -Fq "localSource:'geometry-strip'" POD_ChatGPT.user.js
          grep -Fq 'for(let dy=80;dy<=560;dy+=24)' POD_ChatGPT.user.js
          grep -Fq 'const xOffsets=[-80,0,80,160,240,320,400,480];' POD_ChatGPT.user.js
          ! grep -Fq 'const yOffsets=[-34,-70,-110,-155,-205,-265,-335,-415];' POD_ChatGPT.user.js
          ! grep -Fq 'function findCreateNearPlusFallback(' POD_ChatGPT.user.js
          ! grep -Fq 'document.querySelectorAll(CREATE_CLICK_SELECTOR)' POD_ChatGPT.user.js
          ! grep -Fq 'function createWatcher(' POD_ChatGPT.user.js
          ! grep -Fq 'observer.observe(document.body||document.documentElement' POD_ChatGPT.user.js
          ! grep -Fq "setInterval(()=>{try{updatePanel()}catch(_){}},1000);" POD_ChatGPT.user.js
          python - <<'PY'
          import json
          from pathlib import Path
          s=Path('POD_ChatGPT.user.js').read_text(encoding='utf-8')
          assert "setInterval(()=>{try{updateHeartbeat()}catch(_){}},1000);" in s
          assert 'const pathBefore=location.pathname;let last;' in s
          assert 'isSidebarLike' in s
          assert 'async function waitUploads(' in s
          assert 'async function sendPrompt(' in s
          assert 'async function processBatch()' in s
          assert 'async function downloadNormal(' in s
          a=s.index('  function createCandidateFromPointNode(')
          b=s.index('  function nearbyVisibleCreateFromRoots(',a)
          block=s[a:b]
          assert 'document.querySelectorAll(CREATE_CLICK_SELECTOR)' not in block
          for p in ['POD_ChatGPT.latest.json','POD_ChatGPT_latest.json']:
              with open(p,encoding='utf-8') as f:
                  assert json.load(f)['version']=='1.6.9',p
          with open('POD_ChatGPT.history.json',encoding='utf-8') as f:
              h=json.load(f)
          assert h['versions'][0]['version']=='1.6.9'
          assert h['versions'][1]['version']=='1.6.8'
          PY

      - name: Archive V1.6.9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions
          cp POD_ChatGPT.user.js 'versions/POD_ChatGPT统一工作台_V1.6.9.txt'

      - name: Publish official files and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf .pod_release/v169_final
          rm -f .github/workflows/pod_publish_v169_final.yml
          git add POD_ChatGPT.user.js POD_ChatGPT.meta.js POD_ChatGPT.latest.json POD_ChatGPT_latest.json POD_ChatGPT.history.json versions .pod_release .github/workflows
          git commit -m 'release: POD ChatGPT V1.6.9 local create-menu strip probe fix'
          git push origin HEAD:main
