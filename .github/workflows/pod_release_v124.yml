name: Release POD V1.2.4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.issue.title == '[internal] release POD V1.2.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch POD userscript and update metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('POD_ChatGPT.user.js')
          s = p.read_text(encoding='utf-8')
          if "const APP_VERSION = '1.2.3';" not in s:
              raise SystemExit('Expected V1.2.3 source not found')

          s = s.replace('// @name:zh-CN   ChatGPT服装POD统一工作台 V1.2.3', '// @name:zh-CN   ChatGPT服装POD统一工作台 V1.2.4', 1)
          s = s.replace('// @version      1.2.3', '// @version      1.2.4', 1)
          s = s.replace('// @description  服装POD统一工作台：V1.2.3 修复Excel空白表头误判和34条问题，按有效任务量选择工作表，完整中文生图提示词最高优先，并优化任务表导入显示。', '// @description  服装POD统一工作台：V1.2.4 新增按 Excel 文件名自动创建/复用输出子文件夹，正常图、待确认图和任务记录统一归档；保留稳定 ChatGPT 生图核心。', 1)
          s = s.replace("const APP_VERSION = '1.2.3';", "const APP_VERSION = '1.2.4';", 1)
          v123 = ' * - V1.2.3 修复空白单元格被误判为表头导致只识别34条的问题；所有工作表按有效任务量评分，完整中文生图提示词最高优先；任务表改为按钮选择并显示实际识别信息。'
          v124 = v123 + '\n * - V1.2.4 新增输出归档：选择总输出目录后，若已导入 Excel，则自动按 Excel 文件名（去扩展名）创建/复用批次子文件夹；正常图、待确认图和任务记录统一写入。'
          if v123 not in s:
              raise SystemExit('V1.2.3 changelog anchor missing')
          s = s.replace(v123, v124, 1)

          # Insert output-folder helpers immediately after sanitizeName.
          m = re.search(r"(  function sanitizeName\(n\)\{[^\n]+\}\n)", s)
          if not m:
              raise SystemExit('sanitizeName anchor missing')
          helpers = r'''  function excelBatchFolderName(){
            const file=String(state.importedFileName||'').trim();
            if(!file)return '';
            const stem=file.replace(/\.[^.]+$/,'').trim();
            return sanitizeName(stem).slice(0,120);
          }
          async function getTaskOutputDir(root,{create=true,requestPermission=false}={}){
            if(!root)throw new Error('未选择输出目录');
            if(await permission(root,'readwrite',requestPermission)!=='granted')throw new Error('没有输出目录写入权限');
            const folder=excelBatchFolderName();
            if(!folder)return root;
            return root.getDirectoryHandle(folder,{create});
          }
          async function ensureTaskOutputDir({requestPermission=false,logCreated=false}={}){
            const root=await getHandle(OUTPUT_KEY);
            if(!root)return null;
            const folder=excelBatchFolderName();
            if(!folder)return root;
            const dir=await getTaskOutputDir(root,{create:true,requestPermission});
            if(logCreated)log(`输出子文件夹已就绪：${root.name}/${folder}`,'success');
            return dir;
          }
          function outputDisplayName(root){
            if(!root)return '未选择';
            const folder=excelBatchFolderName();
            return folder?`${root.name}/${folder}`:root.name;
          }
'''
          s = s[:m.end()] + helpers + s[m.end():]

          old = "  async function chooseOutput(){const picker=unsafeWindow.showDirectoryPicker||window.showDirectoryPicker;if(typeof picker!=='function')throw new Error('当前浏览器不支持选择文件夹');const h=await picker.call(unsafeWindow,{mode:'readwrite'});await saveHandle(OUTPUT_KEY,h);log(`输出目录：${h.name}`,'success');updateFolderLabels();}"
          new = "  async function chooseOutput(){const picker=unsafeWindow.showDirectoryPicker||window.showDirectoryPicker;if(typeof picker!=='function')throw new Error('当前浏览器不支持选择文件夹');const h=await picker.call(unsafeWindow,{mode:'readwrite'});await saveHandle(OUTPUT_KEY,h);if(excelBatchFolderName()){await ensureTaskOutputDir({requestPermission:true,logCreated:true});}else log(`输出目录：${h.name}`,'success');await updateFolderLabels();}"
          if old not in s: raise SystemExit('chooseOutput anchor missing')
          s = s.replace(old,new,1)

          old = """    resolveAllTasks();refreshMissingPromptStates();state.phase='ready';saveState();
              const promptInfo=m.prompt>=0?`提示词列“${state.importedHeaders.prompt}”非空 ${m.promptCount||0} 条`:'未检测到提示词列';
              log(`Excel导入成功：${file.name}｜工作表“${m.sheetName}”｜编号列“${state.importedHeaders.id}”｜${promptInfo}｜最终任务 ${tasks.length} 条`,'success');
            }"""
          new = """    resolveAllTasks();refreshMissingPromptStates();state.phase='ready';saveState();
              const promptInfo=m.prompt>=0?`提示词列“${state.importedHeaders.prompt}”非空 ${m.promptCount||0} 条`:'未检测到提示词列';
              log(`Excel导入成功：${file.name}｜工作表“${m.sheetName}”｜编号列“${state.importedHeaders.id}”｜${promptInfo}｜最终任务 ${tasks.length} 条`,'success');
              try{const root=await getHandle(OUTPUT_KEY);if(root)await ensureTaskOutputDir({requestPermission:false,logCreated:true});}catch(e){log(`Excel已导入，但输出子文件夹暂未创建：${e.message||e}`,'warn');}
              await updateFolderLabels();
            }"""
          if old not in s: raise SystemExit('importExcel tail anchor missing')
          s = s.replace(old,new,1)

          old = "  async function validateHandles(request=true){const source=await getHandle(SOURCE_KEY),output=await getHandle(OUTPUT_KEY),template=await getHandle(TEMPLATE_KEY);if(!source)throw new Error('请先选择参考图目录');if(!output)throw new Error('请先选择输出目录');if(await permission(source,'read',request)!=='granted')throw new Error('没有参考图目录读取权限');if(await permission(output,'readwrite',request)!=='granted')throw new Error('没有输出目录写入权限');if(settings.useTemplate){if(!template)throw new Error('已启用模板图，但尚未选择模板图');if(await permission(template,'read',request)!=='granted')throw new Error('没有模板图读取权限');}return{source,output,template};}"
          new = "  async function validateHandles(request=true){const source=await getHandle(SOURCE_KEY),outputRoot=await getHandle(OUTPUT_KEY),template=await getHandle(TEMPLATE_KEY);if(!source)throw new Error('请先选择参考图目录');if(!outputRoot)throw new Error('请先选择输出目录');if(await permission(source,'read',request)!=='granted')throw new Error('没有参考图目录读取权限');if(await permission(outputRoot,'readwrite',request)!=='granted')throw new Error('没有输出目录写入权限');const output=await getTaskOutputDir(outputRoot,{create:true,requestPermission:request});if(settings.useTemplate){if(!template)throw new Error('已启用模板图，但尚未选择模板图');if(await permission(template,'read',request)!=='granted')throw new Error('没有模板图读取权限');}return{source,output,outputRoot,template};}"
          if old not in s: raise SystemExit('validateHandles anchor missing')
          s = s.replace(old,new,1)

          old = "  async function updateFolderLabels(){if(!panel||settings.flow!=='batch_generation')return;const [s,t,o]=await Promise.all([getHandle(SOURCE_KEY),getHandle(TEMPLATE_KEY),getHandle(OUTPUT_KEY)]).catch(()=>[null,null,null]);const set=(role,val)=>panel.querySelectorAll(`[data-role=\"${role}\"]`).forEach(n=>n.textContent=val);set('source',s?s.name:'未选择');set('template',settings.useTemplate?(t?t.name:'未选择'):'未启用');set('output',o?o.name:'未选择');const templateButton=panel.querySelector('[data-act=\"template\"]');if(templateButton)templateButton.disabled=!settings.useTemplate;const templateRow=panel.querySelector('[data-role=\"template-row\"]');if(templateRow)templateRow.classList.toggle('pod-muted',!settings.useTemplate);}"
          new = "  async function updateFolderLabels(){if(!panel||settings.flow!=='batch_generation')return;const [s,t,o]=await Promise.all([getHandle(SOURCE_KEY),getHandle(TEMPLATE_KEY),getHandle(OUTPUT_KEY)]).catch(()=>[null,null,null]);const set=(role,val)=>panel.querySelectorAll(`[data-role=\"${role}\"]`).forEach(n=>n.textContent=val);set('source',s?s.name:'未选择');set('template',settings.useTemplate?(t?t.name:'未选择'):'未启用');set('output',outputDisplayName(o));const templateButton=panel.querySelector('[data-act=\"template\"]');if(templateButton)templateButton.disabled=!settings.useTemplate;const templateRow=panel.querySelector('[data-role=\"template-row\"]');if(templateRow)templateRow.classList.toggle('pod-muted',!settings.useTemplate);}"
          if old not in s: raise SystemExit('updateFolderLabels anchor missing')
          s = s.replace(old,new,1)

          ui = '<div class="pod-row"><span class="pod-label">输出目录</span><span class="pod-value" data-role="output">未选择</span></div>'
          ui2 = ui + '\n        <div style="font-size:10.5px;color:#758196;margin:-2px 0 7px">若已导入 Excel，选择的目录作为“总输出目录”，脚本会自动创建/复用“Excel文件名（去扩展名）”子文件夹；生成图、待确认图和任务记录统一写入该批次文件夹。</div>'
          if ui not in s: raise SystemExit('output UI anchor missing')
          s = s.replace(ui,ui2,1)

          old = "  function exportTasks(){const payload={version:APP_VERSION,flow:settings.flow,exportedAt:new Date().toISOString(),file:state.importedFileName,sheet:state.importedSheetName,headers:state.importedHeaders,importStats:state.importedStats,settings:{...settings},tasks:state.tasks};downloadText(`POD任务记录_V${APP_VERSION}_${stamp()}.json`,JSON.stringify(payload,null,2),'application/json;charset=utf-8');log('POD任务记录已导出','success');}"
          new = "  async function exportTasks(){const payload={version:APP_VERSION,flow:settings.flow,exportedAt:new Date().toISOString(),file:state.importedFileName,sheet:state.importedSheetName,headers:state.importedHeaders,importStats:state.importedStats,settings:{...settings},tasks:state.tasks};const name=`POD任务记录_V${APP_VERSION}_${stamp()}.json`,body=JSON.stringify(payload,null,2);try{const root=await getHandle(OUTPUT_KEY);if(root){const dir=await getTaskOutputDir(root,{create:true,requestPermission:true});await writeBlob(dir,name,new Blob([body],{type:'application/json;charset=utf-8'}));log(`POD任务记录已保存到输出文件夹：${name}`,'success');return;}}catch(e){log(`任务记录写入输出文件夹失败，改为浏览器下载：${e.message||e}`,'warn');}downloadText(name,body,'application/json;charset=utf-8');log('POD任务记录已通过浏览器下载','success');}"
          if old not in s: raise SystemExit('exportTasks anchor missing')
          s = s.replace(old,new,1)

          p.write_text(s, encoding='utf-8')

          # meta.js = exact userscript header; keep the stable base @name identity from V1.2.2.
          header = s.split('// ==/UserScript==',1)[0] + '// ==/UserScript==\n'
          Path('POD_ChatGPT.meta.js').write_text(header, encoding='utf-8')

          notes = [
            '选择输出目录时，若已导入 Excel，自动按 Excel 文件名（去扩展名）创建或复用同名批次子文件夹。',
            '正常生成图和生成数量异常的待确认图统一写入当前 Excel 批次子文件夹，避免不同批次混在同一目录。',
            '导出任务记录时优先直接写入当前批次子文件夹；写入失败才回退为浏览器下载。',
            '若先选择输出目录后再导入 Excel，导入完成后也会自动准备对应子文件夹；已有同名文件夹直接复用，不重复创建。',
            '未导入 Excel 的临时任务保持原逻辑，直接使用用户选择的输出目录。',
            '完整保留 V1.2.3 的 500 条 Excel 识别修复、母提示词可留空、日志按需刷新以及稳定 ChatGPT 上传/创建图片/发送确认/生图检测核心。'
          ]
          latest = {
            'version':'1.2.4',
            'install_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
            'download_url':'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
            'published_at':'2026-08-20',
            'changelog':notes,
          }
          Path('POD_ChatGPT.latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          legacy = {'version':'1.2.4','name':'ChatGPT服装POD统一工作台',**latest}
          Path('POD_ChatGPT_latest.json').write_text(json.dumps(legacy,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          hp=Path('POD_ChatGPT.history.json')
          hist=json.loads(hp.read_text(encoding='utf-8'))
          hist['versions']=[v for v in hist.get('versions',[]) if v.get('version')!='1.2.4']
          hist['versions'].insert(0,{'version':'1.2.4','date':'2026-08-20','notes':notes})
          hp.write_text(json.dumps(hist,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node --check POD_ChatGPT.user.js
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pod_release_v124.yml
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: POD V1.2.4 output batch folders'
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --reason completed --comment 'POD V1.2.4 released and one-time workflow removed.'
