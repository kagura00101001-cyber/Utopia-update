name: dev192 exact test publisher

on:
  push:
    branches: [main]
    paths:
      - '.hotupload/dev192/**'
      - '.github/workflows/dev192-hotupload.yml'

permissions:
  contents: write

concurrency:
  group: dev192-hotupload
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact dev19.2 TEST from frozen dev18 + staged layers
        shell: bash
        run: |
          set -euo pipefail
          required=(
            .hotupload/dev192/generation.js
            .hotupload/dev192/composer.js
            .hotupload/dev192/create-first.js
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "Waiting for $f"
              exit 0
            fi
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib

          src_path = Path('dev/testing/4.1.0-dev.18/Ozon_ChatGPT_DEV_4.1.0-dev.18_TEST.user.js')
          out_path = Path('dev/testing/4.1.0-dev.19.2/Ozon_ChatGPT_DEV_4.1.0-dev.19.2_TEST.user.js')
          src = src_path.read_text(encoding='utf-8')
          marker = '// ==/UserScript=='
          header_end = src.index(marker) + len(marker)
          core_start = src.index('function _0x5e72', header_end)

          header = src[:header_end].replace(
              '// @version      4.1.0-dev.18',
              '// @version      4.1.0-dev.19.2',
              1,
          )
          core = src[core_start:].replace('再次执行', '恢复执行')
          generation = Path('.hotupload/dev192/generation.js').read_text(encoding='utf-8').rstrip('\n')
          composer = Path('.hotupload/dev192/composer.js').read_text(encoding='utf-8').rstrip('\n')
          create_first = Path('.hotupload/dev192/create-first.js').read_text(encoding='utf-8').rstrip('\n')

          final = (
              header + '\n\n' +
              generation + '\n\n\n' +
              core + '\n\n' +
              composer + '\n\n' +
              create_first + '\n\n'
          )
          raw = final.encode('utf-8')
          expected_size = 2141615
          expected_sha256 = '9b015b9de7d75ec6e691edd79cd11395d1bb3642c563d564b312eb32f86e3133'
          got_sha256 = hashlib.sha256(raw).hexdigest()
          if len(raw) != expected_size:
              raise SystemExit(f'size mismatch: {len(raw)} != {expected_size}')
          if got_sha256 != expected_sha256:
              raise SystemExit(f'SHA256 mismatch: {got_sha256} != {expected_sha256}')
          if '// @version      4.1.0-dev.19.2' not in final:
              raise SystemExit('missing target @version')
          for token in ['waitForStableComposer', 'generation_waiting', 'generation_scan_only', 'KaguraCreateImageFirst']:
              if token not in final:
                  raise SystemExit(f'missing marker: {token}')

          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_bytes(raw)
          print('EXACT_OK', out_path, len(raw), got_sha256)
          PY
          rm -rf .hotupload/dev192
          rm -f .github/workflows/dev192-hotupload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'publish: dev 4.1.0-dev.19.2 TEST'
          git push origin HEAD:main
