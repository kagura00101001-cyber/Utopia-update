name: Assemble POD userscript upload

on:
  push:
    paths:
      - '.pod_upload_parts/trigger'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild readable userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .pod_upload_parts/part_*.txt > /tmp/pod_payload.b64
          base64 -d /tmp/pod_payload.b64 > /tmp/pod_payload.gz
          gzip -dc /tmp/pod_payload.gz > POD_ChatGPT.user.js
          node --check <(sed '1s/^/\/\/ temp\n/' POD_ChatGPT.user.js) || true
          rm -rf .pod_upload_parts
          rm -f .github/workflows/pod_upload_assemble.yml
      - name: Commit generated userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A POD_ChatGPT.user.js .pod_upload_parts .github/workflows/pod_upload_assemble.yml
          git commit -m 'feat: publish POD workbench V1.2.3 userscript'
          git push
