name: POD V1.5.11 startup hotfix

on:
  push:
    branches: [main]
    paths:
      - '.pod_release/v1511-hotfix/TRIGGER'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and validate POD V1.5.11
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('POD_ChatGPT.user.js')
          s = p.read_text(encoding='utf-8')

          required = [
              "// @version      1.5.10",
              "const APP_VERSION = '1.5.10';",
              "template:chooseTemplate,logo:chooseLogo,clearLogo:clearLogo",
              "async function chooseReferenceFiles()",
              "async function clearReferenceFiles()",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('hotfix precondition failed: ' + repr(missing))

          s = s.replace('// @name:zh-CN   Kagura POD智能创意中心 V1.5.10', '// @name:zh-CN   Kagura POD智能创意中心 V1.5.11', 1)
          s = s.replace('// @version      1.5.10', '// @version      1.5.11', 1)
          old_desc = '// @description  AI驱动的POD商品视觉生产系统：V1.5.10 新增0～任意张有序参考素材队列、附件Manifest与旧模板/Logo自动迁移，并保留V1.5.9创建图片事件驱动兼容及V1.5.8发送安全核心。'
          new_desc = '// @description  AI驱动的POD商品视觉生产系统：V1.5.11 修复参考素材队列升级后旧模板/Logo动作仍引用已删除函数导致启动失败；保留V1.5.10全部参考素材队列能力。'
          if old_desc not in s:
              raise SystemExit('description precondition failed')
          s = s.replace(old_desc, new_desc, 1)
          s = s.replace('Kagura POD Studio V1.5.10\n   * ================================================================', 'Kagura POD Studio V1.5.11\n   * ================================================================', 1)
          anchor = ' * - V1.5.10 升级为 Kagura POD Studio：批量生图的模板图/Logo图改为0～任意张有序参考素材队列；附件顺序持久化到 Attachment Manifest，旧模板/Logo授权自动迁移。\n'
          if anchor not in s:
              raise SystemExit('changelog anchor missing')
          s = s.replace(anchor, anchor + ' * - V1.5.11 启动热修复：旧模板/Logo按钮兼容动作改接参考素材队列处理器，彻底移除 chooseTemplate/chooseLogo/clearLogo 未定义引用。\n', 1)
          s = s.replace("const APP_VERSION = '1.5.10';", "const APP_VERSION = '1.5.11';", 1)
          s = s.replace('template:chooseTemplate,logo:chooseLogo,clearLogo:clearLogo', 'template:chooseReferenceFiles,logo:chooseReferenceFiles,clearLogo:clearReferenceFiles', 1)

          if 'template:chooseTemplate' in s or 'logo:chooseLogo' in s or 'clearLogo:clearLogo' in s:
              raise SystemExit('legacy undefined action reference still present')
          if "const APP_VERSION = '1.5.11';" not in s:
              raise SystemExit('APP_VERSION patch failed')
          p.write_text(s, encoding='utf-8')

          # Generate metadata directly from userscript header.
          end = s.index('// ==/UserScript==') + len('// ==/UserScript==')
          Path('POD_ChatGPT.meta.js').write_text(s[:end] + '\n', encoding='utf-8')

          notes = [
              '修复 V1.5.10 启动时报错“chooseTemplate is not defined”的问题。',
              '参考素材队列替换模板图/Logo图后，旧界面兼容动作统一改接 chooseReferenceFiles / clearReferenceFiles，不再引用已删除的 chooseTemplate、chooseLogo、clearLogo。',
              '保留 V1.5.10 的 0～任意张有序参考素材、Attachment Manifest、旧模板/Logo自动迁移和按选择顺序上传。',
              '不修改 V1.5.9 创建图片事件驱动兼容与 V1.5.8 at-most-once 发送安全核心。'
          ]
          manifest = {
              'version': '1.5.11',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'download_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
              'published_at': '2026-09-07',
              'changelog': notes,
          }
          text = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          Path('POD_ChatGPT.latest.json').write_text(text, encoding='utf-8')
          Path('POD_ChatGPT_latest.json').write_text(text, encoding='utf-8')

          hp = Path('POD_ChatGPT.history.json')
          hist = json.loads(hp.read_text(encoding='utf-8'))
          for item in hist.get('versions', []):
              if item.get('version') == '1.5.10' and item.get('status') == 'current':
                  item['status'] = 'stable'
          hist['title'] = 'Kagura POD Studio'
          hist['versions'] = [x for x in hist.get('versions', []) if x.get('version') != '1.5.11']
          hist['versions'].insert(0, {
              'version': '1.5.11',
              'date': '2026-09-07',
              'status': 'current',
              'notes': notes,
              'archive_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/versions/POD_ChatGPT统一工作台_V1.5.11.txt',
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/POD_ChatGPT.user.js',
          })
          hp.write_text(json.dumps(hist, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('versions/POD_ChatGPT统一工作台_V1.5.11.txt').write_text(s, encoding='utf-8')
          PY
          node --check POD_ChatGPT.user.js
          grep -q "@version      1.5.11" POD_ChatGPT.user.js
          grep -q "const APP_VERSION = '1.5.11';" POD_ChatGPT.user.js
          ! grep -q 'template:chooseTemplate' POD_ChatGPT.user.js
          ! grep -q 'logo:chooseLogo' POD_ChatGPT.user.js
          ! grep -q 'clearLogo:clearLogo' POD_ChatGPT.user.js
      - name: Publish hotfix and cleanup trigger
        shell: bash
        run: |
          rm -f .pod_release/v1511-hotfix/TRIGGER
          rm -f .github/workflows/pod_v1511_hotfix.yml
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: release Kagura POD Studio V1.5.11 startup hotfix'
          git push origin HEAD:main
