name: Materialize full userscript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manual_update_helper.js'
      - 'payload_01.txt'
      - 'payload_02.txt'
      - 'payload_03.txt'
      - 'payload_04.txt'
      - '.github/workflows/materialize-full-userscript.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode old payload and build full V3.0.28 userscript
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, re, json

          parts = [Path(f'payload_0{i}.txt').read_text(encoding='utf-8').strip() for i in range(1,5)]

          def norm(s):
              s = re.sub(r'\s+', '', s).replace('-', '+').replace('_', '/')
              return s

          def b64(s, strip_all_padding=False):
              s = norm(s)
              if strip_all_padding:
                  s = s.replace('=', '')
              else:
                  s = s.rstrip('=')
              s += '=' * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s, validate=False)

          binaries = []
          # Case A: text chunks are slices of one Base64 string (standard or URL-safe).
          for strip_padding in (False, True):
              try:
                  binaries.append(b64(''.join(parts), strip_padding))
              except Exception:
                  pass
          # Case B: each chunk is separately Base64 encoded.
          try:
              binaries.append(b''.join(b64(p, False) for p in parts))
          except Exception:
              pass
          try:
              binaries.append(b''.join(b64(p, True) for p in parts))
          except Exception:
              pass

          code = None
          errors = []
          for raw in binaries:
              candidates = [raw]
              try:
                  candidates.insert(0, gzip.decompress(raw))
              except Exception as e:
                  errors.append(str(e))
              for data in candidates:
                  try:
                      t = data.decode('utf-8')
                  except Exception:
                      continue
                  if '==UserScript==' in t and ('kagura-gpt-panel' in t or 'ChatGPT 批量生图' in t):
                      code = t
                      break
              if code:
                  break

          if not code:
              raise SystemExit('无法还原旧载荷：' + ' | '.join(errors[-4:]))

          VERSION = '3.0.28'
          # Fixed identity: future manual installs replace the same Tampermonkey entry.
          code = re.sub(r'^// @name\s+.*$', '// @name         Ozon主图下载 + ChatGPT批量生图助手', code, count=1, flags=re.M)
          code = re.sub(r'^// @version\s+.*$', f'// @version      {VERSION}', code, count=1, flags=re.M)
          code = re.sub(r'^// @(?:updateURL|downloadURL)\s+.*\n?', '', code, flags=re.M)
          if '// @connect      raw.githubusercontent.com' not in code:
              marker = '// @connect      *.ozon.ru\n'
              if marker in code:
                  code = code.replace(marker, marker + '// @connect      raw.githubusercontent.com\n', 1)

          # Update all known internal version literals from the payload generation era.
          for old in ('3.0.24','3.0.25','3.0.26','3.0.27'):
              code = code.replace('V'+old, 'V'+VERSION)
              code = code.replace("'"+old+"'", "'"+VERSION+"'")
              code = code.replace('"'+old+'"', '"'+VERSION+'"')

          helper = Path('manual_update_helper.js').read_text(encoding='utf-8')
          code = code.rstrip() + '\n\n' + helper.rstrip() + '\n'
          Path('Ozon_ChatGPT.user.js').write_text(code, encoding='utf-8')

          manifest = {
              'version': VERSION,
              'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_ChatGPT.user.js',
              'published_at': '2026-08-11',
              'changelog': [
                  '取消远程 Base64/gzip 载荷启动方式，完整主脚本直接安装到 Tampermonkey，修复 atob 解码失败。',
                  '不自动更新，也不后台自动检查更新。',
                  '脚本窗口右下角版本处新增“检查更新”，只有手动点击时才访问 GitHub。',
                  '发现新版后显示版本号和更新内容，再手动打开 Tampermonkey 安装页。',
                  '固定脚本名称和 namespace；后续手动安装新版覆盖同一条脚本。'
              ]
          }
          Path('latest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Commit generated full userscript
        run: |
          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Ozon_ChatGPT.user.js latest.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m '发布 V3.0.28 完整手动更新版'
            git push
          fi
