name: "Export V3.0.32 artifact"

"on":
  push:
    paths:
      - '.github/workflows/export-v3.0.32-artifact.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export V3.0.32 txt
        shell: bash
        run: |
          git show 3b8e41f6389c3fabbab516a8a86a1fcce95a97d5:Ozon_ChatGPT.user.js > 'Ozon_ChatGPT批量生图下载器_V3.0.32.txt'
          grep -q '^// @version      3.0.32$' 'Ozon_ChatGPT批量生图下载器_V3.0.32.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: Ozon_ChatGPT_V3.0.32_TXT
          path: Ozon_ChatGPT批量生图下载器_V3.0.32.txt
          if-no-files-found: error
