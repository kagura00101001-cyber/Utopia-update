name: Ozon Complaint V1.1.2 Update

on:
  push:
    paths:
      - '.github/workflows/ozon-complaint-v1.1.2-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish V1.1.2 userscript
        shell: bash
        run: |
          cat .update_parts/ozon_v112_part1.txt \
              .update_parts/ozon_v112_part2.txt \
              .update_parts/ozon_v112_part3.txt \
              .update_parts/ozon_v112_part4.txt \
              .update_parts/ozon_v112_part5.txt \
              .update_parts/ozon_v112_part6.txt \
            | tr -d '\r\n' | base64 -d | gzip -d > Ozon_Complaint.user.js

          node --check Ozon_Complaint.user.js

          python3 - <<'PY'
          from pathlib import Path
          import json
          manifest = {
            'version': '1.1.2',
            'install_url': 'https://raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_Complaint.user.js',
            'changelog': [
              '新增脚本窗口拖动功能，可直接拖动标题栏移动位置',
              '新增缩小成悬浮图标功能，缩小后图标仍可拖动',
              '单击悬浮图标即可恢复完整窗口',
              '自动记住窗口位置和缩小状态，刷新页面后保持',
              '将“可移动 + 可缩小成图标”作为后续油猴脚本的默认基础交互'
            ]
          }
          Path('Ozon_Complaint.latest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

          git config user.name 'Kagura Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Ozon_Complaint.user.js Ozon_Complaint.latest.json
          git commit -m 'Ozon complaint V1.1.2 movable minimized UI'
          git push
