name: Build userscript release

on:
  push:
    branches: [main]
    paths:
      - 'release_build/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build full userscript
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < release_build/trigger.txt)"
          DIR="release_build/${VERSION}"
          echo "Building ${VERSION} from ${DIR}"
          cat "${DIR}"/part_*.b64 | base64 -d | gzip -d > Ozon_ChatGPT.user.js
          cp "${DIR}/Ozon_ChatGPT.meta.js" Ozon_ChatGPT.meta.js
          cp "${DIR}/latest.json" latest.json
          node -c Ozon_ChatGPT.user.js

      - name: Commit release outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Kagura Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Ozon_ChatGPT.user.js Ozon_ChatGPT.meta.js latest.json
          if git diff --cached --quiet; then
            echo "No release output changes"
            exit 0
          fi
          VERSION="$(tr -d '\r\n ' < release_build/trigger.txt)"
          git commit -m "发布 V${VERSION} 完整用户脚本"
          git push
