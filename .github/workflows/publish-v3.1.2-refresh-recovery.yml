name: "Publish V3.2.0 POD update"

"on":
  push:
    branches:
      - main
    paths:
      - 'tools/patch_v3_2_0.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V3.2.0
        run: python3 tools/patch_v3_2_0.py
      - name: Syntax check
        run: node -c Ozon_ChatGPT.user.js
      - name: Verify POD updater
        shell: bash
        run: |
          grep -F '// @version      3.2.0' Ozon_ChatGPT.user.js
          grep -F "const APP_VERSION = '3.2.0'" Ozon_ChatGPT.user.js
          grep -F 'KAGURA_POD_STYLE_UPDATE_V320' Ozon_ChatGPT.user.js
          grep -F 'openPodStyleUpdate' Ozon_ChatGPT.user.js
          grep -F 'raw.githubusercontent.com/kagura00101001-cyber/Utopia-update/main/Ozon_ChatGPT.user.js' Ozon_ChatGPT.user.js
          grep -F '立刻更新' Ozon_ChatGPT.user.js
          ! grep -F '前往 Tampermonkey 更新' Ozon_ChatGPT.user.js
          ! grep -F 'showGuide(updateButton)' Ozon_ChatGPT.user.js
          grep -F '"version": "3.2.0"' latest.json
          test -s 'versions/Ozon_ChatGPT批量生图下载器_V3.2.0.txt'
      - name: Commit V3.2.0
        shell: bash
        run: |
          git config user.name "Kagura Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Ozon_ChatGPT.user.js Ozon_ChatGPT.meta.js latest.json history.json versions
          git diff --cached --quiet && exit 0
          git commit -m "发布 V3.2.0 POD 统一热更新模块"
          git push
